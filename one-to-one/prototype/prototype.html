<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESG 1-to-1 prototype</title>
<!--
  ESG Monthly Technician 1-to-1 - VISUAL PROTOTYPE ONLY.
  Entirely fictional people and data. Not connected to SharePoint; nothing is saved.
  Not production code and not for upload to Welcome. Open this file in any browser.

  Written so the later production frontend can reuse the structure inside Welcome:
  all styles are scoped under .oto, all text is set with textContent (never as HTML),
  there are no external resources, and the code sits in one mount function.
-->
<style>
  .oto {
    --navy: #13516b; --navy-2: #1f7190; --ink: #16222c; --muted: #596674; --line: #d7dde4;
    --bg: #eef3f6; --card: #ffffff; --green: #1e7a46; --green-bg: #e7f4ec; --amber: #8a5a00;
    --amber-bg: #fff4d6; --red: #a4262c; --red-bg: #fde7e9; --blue-bg: #e7f0f6; --focus: #2b78d0;
    --accent: #ef7d3a; --accent-2: #f4a35f; --accent-bg: #fdeadb; --accent-ink: #b7531a;
    --teal-bg: #e4f3f3; --purple: #6a4fb0; --purple-bg: #efeaf8;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; font-size: 15px;
    line-height: 1.45; color: var(--ink); background: var(--bg); min-height: 100vh;
  }
  .oto * { box-sizing: border-box; }
  .oto .proto-bar { background: #3b3b3b; color: #fff; font-size: 13px; padding: 6px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  .oto .proto-bar .roles button { background: transparent; color: #fff; border: 1px solid #888; border-radius: 4px; padding: 3px 10px; margin-left: 6px; cursor: pointer; font-size: 13px; }
  .oto .proto-bar .roles button[aria-pressed="true"] { background: #fff; color: #222; border-color: #fff; }
  .oto header.app { background: linear-gradient(100deg, var(--navy), var(--navy-2)); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .oto header.app h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .oto header.app p { margin: 2px 0 0; opacity: .85; font-size: 13px; }
  .oto header.app .nav { display: flex; gap: 8px; flex-wrap: wrap; }
  .oto header.app .nav button { font: inherit; font-weight: 600; font-size: 13px; background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 20px; padding: 6px 14px; cursor: pointer; }
  .oto header.app .nav button[aria-current="true"] { background: #fff; color: var(--navy); border-color: #fff; }
  .oto main { max-width: 1480px; margin: 0 auto; padding: 16px 28px; }
  .oto .narrow { max-width: 1440px; margin: 0 auto; }
  .oto .qgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 14px; align-items: start; }
  .oto .fullspan { grid-column: 1 / -1; }
  .oto .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 14px; }
  .oto .card h2 { font-size: 17px; margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; }
  .oto .qnum { flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 13px; font-weight: 600; }
  .oto .hint { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
  .oto .guidance { background: var(--blue-bg); border-left: 4px solid var(--navy-2); padding: 8px 12px; font-size: 13px; margin: 6px 0 10px; border-radius: 0 6px 6px 0; }
  .oto label.field { display: block; font-weight: 600; font-size: 14px; margin: 10px 0 4px; }
  .oto textarea, .oto select, .oto input[type="date"] { width: 100%; font: inherit; color: inherit; border: 1px solid #b9c2cd; border-radius: 6px; padding: 8px 10px; background: #fff; }
  .oto textarea { min-height: 70px; resize: vertical; }
  .oto textarea:disabled, .oto select:disabled { background: #f1f3f6; color: #333; border-color: var(--line); }
  .oto :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .oto .choices { display: grid; gap: 8px; }
  .oto .choices.inline { grid-template-columns: repeat(auto-fit, minmax(110px, max-content)); }
  .oto .choices.scale { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .oto .choice { display: flex; flex-direction: column; gap: 2px; border: 1px solid #b9c2cd; border-radius: 6px; padding: 8px 12px; cursor: pointer; background: #fff; position: relative; }
  .oto .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .oto .choice .choice-title { font-weight: 600; }
  .oto .choice .choice-desc { font-size: 13px; color: var(--muted); }
  .oto .choice:has(input:checked) { border-color: var(--navy); background: var(--blue-bg); box-shadow: inset 0 0 0 1px var(--navy); }
  .oto .choice:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
  .oto .choice:has(input:disabled) { cursor: default; opacity: .8; }
  .oto .btn { font: inherit; font-weight: 600; border-radius: 6px; padding: 8px 16px; border: 1px solid var(--navy); background: #fff; color: var(--navy); cursor: pointer; }
  .oto .btn.primary { background: var(--navy); color: #fff; }
  .oto .btn.danger { border-color: var(--red); color: var(--red); }
  .oto .btn:disabled { opacity: .45; cursor: not-allowed; }
  .oto .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .oto .sticky { position: sticky; top: 0; z-index: 5; }
  .oto .status-bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
  .oto .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 12px; background: #e9ecf0; color: #333; white-space: nowrap; }
  .oto .chip.green { background: var(--green-bg); color: var(--green); }
  .oto .chip.amber { background: var(--amber-bg); color: var(--amber); }
  .oto .chip.red { background: var(--red-bg); color: var(--red); }
  .oto .chip.blue { background: var(--blue-bg); color: var(--navy); }
  .oto .feedback { background: #f3f6f2; border-left: 4px solid var(--green); padding: 8px 12px; margin-top: 10px; border-radius: 0 6px 6px 0; font-size: 14px; white-space: pre-wrap; }
  .oto .feedback b { display: block; font-size: 12px; color: var(--green); text-transform: uppercase; letter-spacing: .03em; }
  .oto .missing { border-left: 4px solid var(--red); background: var(--red-bg); padding: 10px 12px; border-radius: 0 6px 6px 0; }
  .oto .done { border-left: 4px solid var(--green); background: var(--green-bg); padding: 10px 12px; border-radius: 0 6px 6px 0; }
  .oto .exp { border: 1px solid var(--line); border-radius: 6px; padding: 12px; margin-top: 10px; }
  .oto .exp h3 { margin: 0; font-size: 15px; }
  .oto .answer { white-space: pre-wrap; background: #f7f8fa; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 4px 0 8px; min-height: 38px; }
  .oto .answer.empty { color: var(--muted); font-style: italic; }
  .oto .banner { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-weight: 600; }
  .oto .banner.amber { background: var(--amber-bg); color: var(--amber); border: 1px solid #f0d58a; }
  .oto .banner.info { background: var(--blue-bg); color: var(--navy); border: 1px solid #c4d6ee; }
  .oto .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .oto .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .oto .kpi .v { font-size: 26px; font-weight: 700; color: var(--navy); }
  .oto .kpi.month .v { font-size: 18px; padding-top: 6px; }
  .oto .kpi .l { font-size: 13px; color: var(--muted); }
  .oto .kpi.alert .v { color: var(--amber); }
  .oto .kpi.bad .v { color: var(--red); }
  .oto .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  .oto .tabs button { font: inherit; background: none; border: none; border-bottom: 3px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .oto .tabs button[aria-selected="true"] { color: var(--navy); border-bottom-color: var(--navy); }
  .oto .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 10px; }
  .oto .filters > div { min-width: 180px; }
  .oto .filters label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 2px; }
  .oto table.grid { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .oto table.grid th { text-align: left; font-size: 13px; color: var(--muted); background: #eef1f5; padding: 8px 10px; }
  .oto table.grid td { padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  .oto table.grid tr.req td { background: var(--amber-bg); }
  .oto .muted { color: var(--muted); }
  .oto .footer-note { color: var(--muted); font-size: 13px; margin-top: 14px; }
  .oto .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 14px; }
  .oto .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
  .oto .modal { background: #fff; border-radius: 8px; padding: 18px; max-width: 460px; width: 100%; }
  .oto .modal h3 { margin: 0 0 8px; }
  .oto .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #233; color: #fff; padding: 10px 16px; border-radius: 6px; z-index: 60; max-width: 90vw; }
  .oto .toast.err { background: var(--red); }
  .oto .meterwrap { margin-top: 8px; }
  .oto .meterwrap .lbl { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:3px; }
  .oto .meter { height: 8px; border-radius: 6px; background: #e6eaef; overflow: hidden; }
  .oto .meter > i { display:block; height:100%; width:0; background: linear-gradient(90deg,#2d7a46,#1e7a46); transition: width .25s ease; }
  .oto .meter.full > i { background: linear-gradient(90deg,#1e7a46,#0a6b2d); }
  .oto .countdown { font-size:12px; font-weight:600; padding:2px 9px; border-radius:12px; white-space:nowrap; }
  .oto .countdown.ok { background: var(--green-bg); color: var(--green); }
  .oto .countdown.soon { background: var(--amber-bg); color: var(--amber); }
  .oto .countdown.over { background: var(--red-bg); color: var(--red); }
  .oto .spark { display:flex; align-items:flex-end; gap:4px; height:46px; margin-top:6px; }
  .oto .spark .bar { flex:1; min-width:10px; border-radius:3px 3px 0 0; background: var(--navy-2); position:relative; display:flex; align-items:flex-end; justify-content:center; }
  .oto .spark .bar span { position:absolute; top:-16px; font-size:11px; color:var(--muted); }
  .oto .spark .bar b { font-size:10px; color:#fff; padding-bottom:2px; font-weight:600; }
  .oto .spark .bar.w5 { background:#a4262c; } .oto .spark .bar.w4 { background:#b4690e; } .oto .spark .bar.w3 { background:#2d7a46; } .oto .spark .bar.w2 { background:#3a7fb5; } .oto .spark .bar.w1 { background:#8a8f98; }
  .oto .ratebar { height:6px; border-radius:4px; background:#e6eaef; overflow:hidden; margin:6px 0 2px; }
  .oto .ratebar > i { display:block; height:100%; background:var(--navy-2); transition:width .2s ease; }
  .oto .collapse-head { cursor:pointer; user-select:none; display:flex; align-items:center; gap:8px; }
  .oto .collapse-head .tick { color: var(--green); font-weight:700; }

  /* ---- engagement: mood, streak, wins, private notes, chat ---- */
  .oto .pill { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:3px 10px; border-radius:14px; white-space:nowrap; }
  .oto .pill.streak { background: var(--accent-bg); color: var(--accent-ink); }
  .oto .pill.flame { font-size:13px; }
  .oto .mood { display:flex; gap:8px; flex-wrap:wrap; }
  .oto .mood button { font:inherit; cursor:pointer; border:1px solid #c2cad3; background:#fff; border-radius:10px; padding:8px 10px; min-width:78px; display:flex; flex-direction:column; align-items:center; gap:2px; transition:transform .08s ease; }
  .oto .mood button:hover:not(:disabled) { transform:translateY(-2px); }
  .oto .mood button .emo { font-size:22px; line-height:1; }
  .oto .mood button .ml { font-size:11px; color:var(--muted); font-weight:600; }
  .oto .mood button[aria-pressed="true"] { border-color:var(--navy); background:var(--teal-bg); box-shadow:inset 0 0 0 1px var(--navy); }
  .oto .mood button:disabled { cursor:default; opacity:.9; }
  .oto .accent-card { border-left:4px solid var(--accent); }
  .oto .win-wall { display:flex; flex-direction:column; gap:6px; max-height:150px; overflow:auto; margin-top:8px; }
  .oto .win-wall .w { background:var(--accent-bg); border-radius:6px; padding:6px 10px; font-size:13px; }
  .oto .win-wall .w b { display:block; font-size:11px; color:var(--accent-ink); text-transform:uppercase; letter-spacing:.03em; }
  .oto .notes-card { border-left:4px solid var(--purple); background:#fbfaff; }
  .oto .lockline { font-size:12px; color:var(--purple); font-weight:600; display:flex; align-items:center; gap:5px; }

  /* ---- appraisal tracker ---- */
  .oto .appraise { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; }
  .oto .gauge { border:1px solid var(--line); border-radius:8px; padding:12px; }
  .oto .gauge .who { font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .oto .gauge .score { font-size:30px; font-weight:800; color:var(--navy); line-height:1.1; }
  .oto .gauge .score small { font-size:14px; color:var(--muted); font-weight:600; }
  .oto .track { position:relative; height:12px; border-radius:7px; margin:10px 0 4px; background:linear-gradient(90deg,#e7b4b6 0%,#f0cf9a 32%,#bfe3cd 55%,#8ed3ab 100%); }
  .oto .track > i { position:absolute; top:-3px; width:4px; height:18px; border-radius:2px; background:#1a2630; box-shadow:0 0 0 2px #fff; transform:translateX(-2px); }
  .oto .track .end { position:absolute; font-size:10px; color:var(--muted); top:14px; }
  .oto .band { display:inline-block; font-size:12px; font-weight:700; padding:2px 10px; border-radius:12px; }
  .oto .band.b0 { background:var(--red-bg); color:var(--red); }
  .oto .band.b1 { background:var(--amber-bg); color:var(--amber); }
  .oto .band.b2 { background:var(--green-bg); color:var(--green); }
  .oto .band.b3 { background:#dff0ff; color:#0b61a4; }
  .oto .summ { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; margin-top:12px; }
  .oto .summ .s { border-radius:6px; padding:8px 10px; font-size:13px; }
  .oto .summ .s.good { background:var(--green-bg); } .oto .summ .s.improve { background:var(--amber-bg); } .oto .summ .s.pos { background:var(--blue-bg); }
  .oto .summ .s b { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px; }
  .oto details.howto { margin-top:10px; font-size:13px; } .oto details.howto summary { cursor:pointer; color:var(--navy); font-weight:600; }
  .oto .bandtbl { width:100%; border-collapse:collapse; margin-top:6px; } .oto .bandtbl td { border-top:1px solid var(--line); padding:4px 8px; }
  .oto .setrow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .oto .setrow input { width:90px; }

  /* ---- arcade ---- */
  .oto .arcade-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; align-items:start; }
  .oto .game { border:1px solid var(--line); border-radius:10px; padding:16px; background:var(--card); display:flex; flex-direction:column; gap:8px; }
  .oto .game.soon { opacity:.6; }
  .oto .game.wide { grid-column:1 / -1; }
  .oto .game .gt { font-weight:700; font-size:16px; display:flex; align-items:center; gap:8px; }
  .oto .game .gd { font-size:13px; color:var(--muted); }
  .oto .game .best { font-size:12px; font-weight:700; color:var(--accent-ink); }
  .oto .hu-hud { display:flex; gap:14px; align-items:center; flex-wrap:wrap; font-size:13px; }
  .oto .hu-pill { font-size:12px; font-weight:700; padding:2px 9px; border-radius:12px; background:#eef1f5; }
  .oto .hu-pill.time { background:var(--blue-bg); color:var(--navy); } .oto .hu-pill.time.low { background:var(--red-bg); color:var(--red); }
  .oto .hu-pill.found { background:var(--green-bg); color:var(--green); }
  /* big tappable reaction panel */
  .oto .react-panel { height:120px; border-radius:10px; display:grid; place-items:center; color:#fff; font-weight:700; font-size:18px; cursor:pointer; user-select:none; text-align:center; padding:10px; }
  /* flaggable lines (procedure, form, diff) */
  .oto .hu-doc { border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff; font-size:13px; }
  .oto .hu-line { display:flex; gap:8px; padding:7px 10px; border-top:1px solid #eef1f5; cursor:pointer; align-items:flex-start; }
  .oto .hu-doc .hu-line:first-child { border-top:none; }
  .oto .hu-line:hover { background:#f5f8fb; }
  .oto .hu-line .ix { flex:none; width:34px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .oto .hu-line.flag { background:var(--amber-bg); box-shadow:inset 3px 0 0 var(--amber); }
  .oto .hu-line.ok { background:var(--green-bg); box-shadow:inset 3px 0 0 var(--green); cursor:default; }
  .oto .hu-line.bad { background:var(--red-bg); box-shadow:inset 3px 0 0 var(--red); cursor:default; }
  .oto .hu-line.missed { background:#fff6e6; box-shadow:inset 3px 0 0 var(--amber); cursor:default; }
  .oto .hu-line .why { color:var(--muted); font-style:italic; }
  .oto .diffcols { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  /* typing game */
  .oto .type-target { font-family:"Cascadia Code",Consolas,"Courier New",monospace; font-size:14px; line-height:1.7; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; white-space:pre-wrap; }
  .oto .type-target .c { border-radius:2px; }
  .oto .type-target .c.ok { background:#d6efde; color:#0a6b2d; }
  .oto .type-target .c.bad { background:#f6d4d6; color:#a4262c; text-decoration:underline; }
  .oto .type-target .c.cur { box-shadow:inset 0 -2px 0 var(--navy); }
  .oto .type-in { width:100%; font-family:"Cascadia Code",Consolas,"Courier New",monospace; font-size:14px; border:1px solid #b9c2cd; border-radius:6px; padding:8px 10px; min-height:70px; resize:vertical; }
  /* option buttons (three-way, transposition) */
  .oto .opts { display:flex; gap:8px; flex-wrap:wrap; }
  .oto .opt-btn { font:inherit; font-weight:700; border:1px solid #b9c2cd; background:#fff; border-radius:8px; padding:8px 14px; cursor:pointer; font-variant-numeric:tabular-nums; }
  .oto .opt-btn:hover:not(:disabled) { border-color:var(--navy); background:var(--teal-bg); }
  .oto .opt-btn.pick-ok { border-color:var(--green); background:var(--green-bg); color:var(--green); }
  .oto .opt-btn.pick-bad { border-color:var(--red); background:var(--red-bg); color:var(--red); }
  .oto .tagbig { font-family:Consolas,"Courier New",monospace; font-weight:800; font-size:30px; letter-spacing:2px; background:#16222c; color:#fff; border-radius:8px; padding:12px; text-align:center; }
  .oto .msgbox { background:var(--blue-bg); border-left:4px solid var(--navy-2); border-radius:0 6px 6px 0; padding:10px 12px; font-size:14px; }
  .oto .readback { display:grid; gap:8px; }
  .oto .readback .fld { font-size:13px; } .oto .readback .fld .fl { font-weight:600; margin-bottom:3px; }
  .oto .leader { width:100%; border-collapse:collapse; }
  .oto .leader th { text-align:left; font-size:12px; color:var(--muted); padding:6px 8px; }
  .oto .leader td { padding:6px 8px; border-top:1px solid var(--line); }
  .oto .leader tr.me td { background:var(--teal-bg); font-weight:700; }
  .oto .leader .rk { width:30px; font-weight:800; color:var(--accent-ink); }

  /* ---- confetti ---- */
  .oto .confetti { position:fixed; inset:0; pointer-events:none; z-index:70; overflow:hidden; }
  .oto .confetti i { position:absolute; width:9px; height:14px; top:-20px; border-radius:2px; animation:otofall linear forwards; }
  @keyframes otofall { to { transform:translateY(105vh) rotate(540deg); opacity:.9; } }
  @media (max-width: 700px) {
    .oto main { padding: 10px; }
    .oto table.grid thead { display: none; }
    .oto table.grid, .oto table.grid tbody, .oto table.grid tr, .oto table.grid td { display: block; width: 100%; }
    .oto table.grid tr { border-top: 6px solid var(--bg); }
    .oto table.grid td { border-top: none; padding: 4px 12px; }

    .oto .sticky { position: static; }
  }
</style>
</head>
<body style="margin:0">
<div class="oto" id="oto-root"></div>
<script>
(function () {
  'use strict';

  // ---------------- fixed reference data (agreed wording) ----------------
  var WORKLOAD = [
    { value: 1, title: '1 – Very light', desc: 'Significantly below capacity' },
    { value: 2, title: '2 – Light', desc: 'Some spare capacity' },
    { value: 3, title: '3 – Manageable', desc: 'Appropriate workload' },
    { value: 4, title: '4 – Heavy', desc: 'Busy but manageable' },
    { value: 5, title: '5 – Excessive', desc: 'Struggling to manage' }

    var waiting = false, ready = false, startT = 0, toId = null;
    box.addEventListener('click', function () {
      if (!waiting && !ready) {
        waiting = true; box.style.background = '#a4262c'; box.textContent = 'WAIT — hold position…';
        toId = once(function () { ready = true; waiting = false; box.style.background = '#2d7a46'; box.textContent = 'SCRAM NOW'; startT = Date.now(); }, 1000 + Math.random() * 2800);
      } else if (waiting) {
        waiting = false; clearTimeout(toId); box.style.background = '#8a5a00'; box.textContent = 'You anticipated — reset. Click to arm';
      } else if (ready) {
        var ms = Date.now() - startT; ready = false; box.style.background = '#7a828c'; box.textContent = ms + ' ms — click to arm again';
        if (ms < GAME_BEST.shutdown) { GAME_BEST.shutdown = ms; best.textContent = 'Best: ' + ms + ' ms'; toast('⚡ New best: ' + ms + ' ms!'); }
      }
    });

      h('div', { class: 'gt' }, ['🛑 Shutdown the reactor']),

    ]);

  // ---- 2. Type the Daily Safety Message (CPS + accuracy) ----
  function gameTyping() {
    var target = SAFETY_MESSAGES[dailyIndex(SAFETY_MESSAGES.length)];
    var view = h('div', { class: 'type-target' });
    var ta = h('textarea', { class: 'type-in', placeholder: 'Start typing to begin the clock…', spellcheck: 'false', autocapitalize: 'off', autocomplete: 'off', autocorrect: 'off' });
    var hud = h('div', { class: 'hu-hud' });
    var best = h('span', { class: 'best' });
    var started = 0, done = false;
    function setBest() { best.textContent = GAME_BEST.typing ? 'Best: ' + GAME_BEST.typing.toFixed(1) + ' cps' : 'Best: —'; }
    setBest();
    function paint() {
      var v = ta.value, correct = 0;
      view.textContent = '';
      for (var i = 0; i < target.length; i++) {
        var cls = 'c';
        if (i < v.length) { if (v[i] === target[i]) { cls += ' ok'; correct += 1; } else { cls += ' bad'; } }
        else if (i === v.length) { cls += ' cur'; }
        view.appendChild(h('span', { class: cls, text: target[i] }));
      }
      return correct;
    }
    paint();
    ta.addEventListener('paste', function (e) { e.preventDefault(); });
    ta.addEventListener('input', function () {
      if (done) { return; }
      if (!started && ta.value.length) { started = Date.now(); }
      var correct = paint();
      var secs = started ? (Date.now() - started) / 1000 : 0;
      var cps = secs > 0 ? correct / secs : 0;
      var acc = Math.round(correct / target.length * 100);
      hud.textContent = '';
      hud.appendChild(h('span', { class: 'hu-pill', text: cps.toFixed(1) + ' cps' }));
      hud.appendChild(h('span', { class: 'hu-pill', text: acc + '% accurate' }));
      if (ta.value.length >= target.length) {
        done = true; ta.disabled = true;
        var finalCps = correct / Math.max(0.5, secs);
        if (finalCps > GAME_BEST.typing) { GAME_BEST.typing = finalCps; setBest(); toast('⚡ New best: ' + finalCps.toFixed(1) + ' cps!'); }
        hud.appendChild(h('span', { class: 'hu-pill found', text: 'Done' }));
        if (acc === 100) { confetti(); }
      }
    });
    var reset = h('button', { class: 'btn', type: 'button', text: 'Reset', onclick: function () { ta.value = ''; ta.disabled = false; started = 0; done = false; hud.textContent = ''; paint(); ta.focus(); } });
    return h('section', { class: 'game wide' }, [
      h('div', { class: 'gt' }, ['⌨ Type the Daily Safety Message']),
      h('div', { class: 'gd', text: 'Type it exactly — punctuation and capitals count. Score is characters per second with your accuracy.' }),
      view, ta,
      h('div', { class: 'hu-hud' }, [hud, best, reset])
    ]);
  }

      doc.textContent = ''; lineEls = [];
      data.items.forEach(function (it) {
        var el = h('div', { class: 'hu-line' }, cfg.render(it));
        el.dataset.flag = '0';
        el.addEventListener('click', function () {
          if (!running || over) { return; }
          if (el.dataset.flag === '1') { el.dataset.flag = '0'; el.classList.remove('flag'); if (it.bad) { found -= 1; } else { wrong -= 1; } }
          else { el.dataset.flag = '1'; el.classList.add('flag'); if (it.bad) { found += 1; } else { wrong += 1; } }
          foundPill.textContent = found + ' / ' + targets + ' found';
          if (found === targets) { finish(true); }
        });
        lineEls.push(el); doc.appendChild(el);
      });
    }
    function reveal() {
      data.items.forEach(function (it, idx) {
        var el = lineEls[idx]; el.classList.remove('flag');
        if (it.bad) { el.classList.add(el.dataset.flag === '1' ? 'ok' : 'missed'); el.appendChild(h('span', { class: 'why', text: ' — ' + it.why })); }
        else if (el.dataset.flag === '1') { el.classList.add('bad'); el.appendChild(h('span', { class: 'why', text: ' — not an error' })); }
      });
    }
    function finish(won) {
      running = false; over = true; clearInterval(clockId);
      startBtn.disabled = false; startBtn.textContent = 'Play again';
      if (won) {
        var score = Math.max(0, 100 - wrong * 15 + left * 2);
        if (score > GAME_BEST[cfg.bestKey]) { GAME_BEST[cfg.bestKey] = score; bestEl.textContent = 'Best: ' + score; }
        msg.textContent = 'All ' + targets + ' found' + (wrong ? ' (' + wrong + ' wrong flag' + (wrong === 1 ? '' : 's') + ')' : '') + '! Score ' + score + '.';
        confetti();
      } else { msg.textContent = 'Time up — ' + found + ' of ' + targets + ' found.'; }
      reveal();
    }
    function start() {
      if (running) { return; }
      running = true; over = false; found = 0; wrong = 0; left = cfg.seconds;
      build();
      foundPill.textContent = '0 / ' + targets + ' found'; timePill.textContent = cfg.seconds + 's'; timePill.classList.remove('low'); msg.textContent = '';
      startBtn.disabled = true;
      clockId = timer(function () { left -= 1; timePill.textContent = left + 's'; if (left <= 10) { timePill.classList.add('low'); } if (left <= 0) { finish(false); } }, 1000);
    }
    build();
    var bestEl = h('span', { class: 'best', text: 'Best: ' + GAME_BEST[cfg.bestKey] });
    var startBtn = h('button', { class: 'btn primary', type: 'button', text: 'Start ' + cfg.seconds + 's', onclick: start });
    foundPill.textContent = '0 / ' + targets + ' found'; timePill.textContent = cfg.seconds + 's';
    return h('section', { class: 'game wide' }, [
      h('div', { class: 'gt' }, [cfg.emoji + ' ' + cfg.title]),
      h('div', { class: 'gd', text: cfg.desc }),
      h('div', { style: 'font-weight:600;font-size:13px', text: data.title || data.subtitle || '' }),
      doc,
      h('div', { class: 'hu-hud' }, [foundPill, timePill, bestEl]),
      h('div', { class: 'btn-row' }, [startBtn]), msg
    ]);
  }

  // ---- 3. Spot the mistake in the instruction ----
  function gameMistake() {
    return huFindGame({
      emoji: '🔎', title: 'Spot the mistake', bestKey: 'mistake', seconds: 60,
      desc: 'A numbered instruction with 5 planted errors — spelling, numbering, order, impossible values, missing sign-off. Tap all 5 before time runs out. Rotates daily.',
      pick: function () { return PROCEDURES[dailyIndex(PROCEDURES.length)]; },
      render: function (it) { return [h('span', { class: 'ix', text: it.ix }), h('span', null, it.text)]; }
    });
  }

  // ---- 4. Spot the paperwork defect ----
  function gamePaperwork() {
    return huFindGame({
      emoji: '📋', title: 'Spot the paperwork defect', bestKey: 'paperwork', seconds: 60,
      desc: 'A completed record with defects — blanks, missing signatures, impossible dates/values, times out of order. Tap every defect. Rotates daily.',
      pick: function () { return FORMS[dailyIndex(FORMS.length)]; },
      render: function (it) { return [h('span', { class: 'ix', style: 'min-width:170px;font-weight:600;color:var(--ink)', text: it.label }), h('span', { class: it.value ? '' : 'muted', text: it.value || '(blank)' })]; }
    });
  }

  // ---- 7. Spot the difference ----
  function gameSpotDiff() {
    return huFindGame({
      emoji: '🔀', title: 'Spot the difference', bestKey: 'spotdiff', seconds: 50,
      desc: 'Two copies of a lineup or reading sheet. Tap every row where the two columns do not match. A real verification / self-checking drill. Rotates daily.',
      pick: function () { return DIFFS[dailyIndex(DIFFS.length)]; },
      render: function (it) { return [
        h('span', { class: 'ix', style: 'min-width:150px;font-weight:600;color:var(--ink)', text: it.label }),
        h('span', { style: 'font-variant-numeric:tabular-nums' }, [it.left, h('span', { class: 'muted', text: '   vs   ' }), it.right])
      ]; }
    });
  }

  // ---- 5. Three-way communication ----
  function gameThreeway() {
    var idx = dailyIndex(COMMS.length), streak = 0;
    var msgBox = h('div', { class: 'msgbox' });
    var fieldWrap = h('div', { class: 'readback' });
    var result = h('div', { class: 'hint' });
    var streakPill = h('span', { class: 'hu-pill found', text: 'Streak: 0' });
    var bestEl = h('span', { class: 'best', text: 'Best: ' + GAME_BEST.threeway });
    var picks = {}, confirmBtn, nextBtn;
    function round() {
      var r = COMMS[idx % COMMS.length]; picks = {}; result.textContent = '';
      msgBox.textContent = 'Sender: "' + r.msg + '"';
      fieldWrap.textContent = '';
      r.fields.forEach(function (f, fi) {
        var opts = h('div', { class: 'opts' }, shuffle(f.options).map(function (o) {
          var b = h('button', { class: 'opt-btn', type: 'button', text: o, onclick: function () {
            if (b.disabled) { return; }
            picks[fi] = o;
            Array.prototype.forEach.call(opts.children, function (c) { c.classList.remove('pick-ok'); });
            b.classList.add('pick-ok');
          } });
          return b;
        }));
        fieldWrap.appendChild(h('div', { class: 'fld' }, [h('div', { class: 'fl', text: 'Read back the ' + f.fl + ':' }), opts]));
      });
      confirmBtn.disabled = false; nextBtn.disabled = true;
    }
    confirmBtn = h('button', { class: 'btn primary', type: 'button', text: 'Confirm read-back', onclick: function () {
      var r = COMMS[idx % COMMS.length];
      if (Object.keys(picks).length < r.fields.length) { result.textContent = 'Read back every field first.'; return; }
      var allOk = r.fields.every(function (f, fi) { return picks[fi] === f.correct; });
      if (allOk) { streak += 1; streakPill.textContent = 'Streak: ' + streak; if (streak > GAME_BEST.threeway) { GAME_BEST.threeway = streak; bestEl.textContent = 'Best: ' + streak; } result.textContent = 'Sender confirms: correct. ✔'; }
      else { result.textContent = 'Mismatch — sender does not confirm. Streak reset. (Needed: ' + r.fields.map(function (f) { return f.correct; }).join(', ') + ')'; streak = 0; streakPill.textContent = 'Streak: 0'; }
      confirmBtn.disabled = true; nextBtn.disabled = false;
    } });
    nextBtn = h('button', { class: 'btn', type: 'button', text: 'Next', disabled: true, onclick: function () { idx += 1; round(); } });
    round();
    return h('section', { class: 'game wide' }, [
      h('div', { class: 'gt' }, ['🗣 Three-way communication']),
      h('div', { class: 'gd', text: 'Read the instruction back exactly — watch for transposed tags and values. Build the longest streak of correct read-backs.' }),
      msgBox, fieldWrap,
      h('div', { class: 'hu-hud' }, [streakPill, bestEl]),
      h('div', { class: 'btn-row' }, [confirmBtn, nextBtn]), result
    ]);
  }

  // ---- 6. Transposition catcher ----
  function gameTranspose() {
    function makeRound() {
      var pre = ['1V-', '2P-', 'HX-', 'CV-', '3T-', 'LT-'][Math.floor(Math.random() * 6)];
      var digits = String(1000 + Math.floor(Math.random() * 9000));
      var correct = pre + digits, set = {}; set[correct] = true; var opts = [correct], tries = 0;
      while (opts.length < 5 && tries < 60) {
        tries += 1; var d = digits.split(''); var i = Math.floor(Math.random() * 4), j = Math.floor(Math.random() * 4);
        if (i === j) { j = (j + 1) % 4; }
        var t = d[i]; d[i] = d[j]; d[j] = t; var cand = pre + d.join('');
        if (!set[cand]) { set[cand] = true; opts.push(cand); }
      }
      return { correct: correct, options: shuffle(opts) };
    }
    var tag = h('div', { class: 'tagbig' });
    var opts = h('div', { class: 'opts' });
    var hud = h('div', { class: 'hu-hud' });
    var scorePill = h('span', { class: 'hu-pill found', text: 'Score: 0' });
    var timePill = h('span', { class: 'hu-pill time', text: '30s' });
    var bestEl = h('span', { class: 'best', text: 'Best: ' + GAME_BEST.transpose });
    hud.appendChild(scorePill); hud.appendChild(timePill); hud.appendChild(bestEl);
    var score = 0, left = 30, running = false, clockId = null, cur = null;
    function next() {
      cur = makeRound(); tag.textContent = cur.correct; opts.textContent = '';
      cur.options.forEach(function (o) {
        var b = h('button', { class: 'opt-btn', type: 'button', text: o, onclick: function () {
          if (!running) { return; }
          if (o === cur.correct) { score += 1; scorePill.textContent = 'Score: ' + score; next(); }
          else { b.classList.add('pick-bad'); score = Math.max(0, score - 1); scorePill.textContent = 'Score: ' + score; }
        } });
        opts.appendChild(b);
      });
    }
    function start() {
      if (running) { return; }
      running = true; score = 0; left = 30; scorePill.textContent = 'Score: 0'; timePill.textContent = '30s'; timePill.classList.remove('low');
      startBtn.disabled = true; next();
      clockId = timer(function () { left -= 1; timePill.textContent = left + 's'; if (left <= 10) { timePill.classList.add('low'); }
        if (left <= 0) { running = false; clearInterval(clockId); startBtn.disabled = false; startBtn.textContent = 'Play again'; opts.textContent = '';
          if (score > GAME_BEST.transpose) { GAME_BEST.transpose = score; bestEl.textContent = 'Best: ' + score; toast('⚡ New best: ' + score + '!'); } } }, 1000);
    }
    var startBtn = h('button', { class: 'btn primary', type: 'button', text: 'Start 30s', onclick: start });
    return h('section', { class: 'game' }, [
      h('div', { class: 'gt' }, ['🔢 Transposition catcher']),
      h('div', { class: 'gd', text: 'The exact tag is shown at the top. Pick the matching one below — the others are transposed. As many as you can in 30 seconds.' }),
      tag, opts, hud,
      h('div', { class: 'btn-row' }, [startBtn])
    ]);
  }
  function leaderCard() {
    var sorted = LEADERBOARD.slice().sort(function (x, y) { return y.score - x.score; });
    return h('section', { class: 'card' }, [
      h('h2', { text: '🏆 This month\'s HU leaderboard' }),
      h('p', { class: 'hint', text: 'Opt-in and shown by nickname only. (Mocked for the prototype — in the real system scores live in a separate shared list that never touches your review data.)' }),
      h('table', { class: 'leader' }, [
        h('thead', null, h('tr', null, [h('th', { class: 'rk', text: '#' }), h('th', { text: 'Player' }), h('th', { text: 'Score' })])),
        h('tbody', null, sorted.map(function (x, i) { return h('tr', { class: x.me ? 'me' : null }, [h('td', { class: 'rk', text: String(i + 1) }), h('td', { text: x.who }), h('td', { text: String(x.score) })]); }))
      ])
    ]);
  }
  function arcadeView() {
    var soon = [
      ['👁 Reading verification', 'Read the gauge, type the exact value.'],
      ['🪤 Error-trap spotter', 'Match the scenario to its error precursor.'],
      ['✅ Place-keeping', 'Tick each step in order — don\'t skip, resist the distractor.']
    ].map(function (g) {
      return h('section', { class: 'game soon' }, [h('div', { class: 'gt' }, [g[0]]), h('div', { class: 'gd', text: g[1] })]);
    });
    return h('div', { class: 'narrow' }, [
      h('div', { class: 'banner info', text: '🎮 The HU Arcade — quick games that sharpen the Human Performance skills we use on the plant. Optional fun, totally separate from your 1-to-1: game scores never mix with review data. The leaderboard is opt-in and shows a nickname only.' }),
      h('div', { class: 'arcade-grid' }, [gameShutdown(), gameTranspose(), gameThreeway(), gameTyping(), gameMistake(), gamePaperwork(), gameSpotDiff()]),
      leaderCard(),
      h('h2', { style: 'margin:18px 0 8px', text: 'More HU games coming soon' }),
      h('div', { class: 'arcade-grid' }, soon)
    ]);
  }

  // ---------------- shell ----------------
  function render() {
    clearTimers();
    root.textContent = '';
    live = h('div', { class: 'sr', 'aria-live': 'polite', style: 'position:absolute;left:-9999px' });
    function roleBtn(role, label) {
      return h('button', { type: 'button', 'aria-pressed': state.role === role ? 'true' : 'false', text: label, onclick: function () {
        state.role = role; state.view = role === 'tech' ? 'tech' : 'dash'; state.reviewId = null; render();
      } });
    }
    root.appendChild(h('div', { class: 'proto-bar' }, [
      h('span', { text: 'PROTOTYPE – fictional people and data. Not connected to SharePoint; nothing is saved. "Today" is ' + fmtDate(TODAY) + '.' }),
      h('span', { class: 'roles' }, ['View as:', roleBtn('tech', 'Technician (' + ME + ')'), roleBtn('tl', 'Team Leader')])
    ]));
    function navBtn(view, label) {
      var cur = state.view === view || (view === 'dash' && state.view === 'mgr');
      return h('button', { type: 'button', 'aria-current': cur ? 'true' : 'false', text: label, onclick: function () {
        state.view = view; if (view === 'dash') { state.reviewId = null; } render();
      } });
    }
    var home = state.role === 'tech' ? navBtn('tech', 'My 1-to-1') : navBtn('dash', 'Dashboard');
    root.appendChild(h('header', { class: 'app' }, [
      h('div', null, [
        h('h1', { text: 'ESG Technician 1-to-1' }),
        h('p', { text: state.view === 'arcade' ? 'The Arcade' : (state.role === 'tech' ? 'My monthly 1-to-1' : (state.view === 'mgr' ? 'Review and feedback' : 'Team Leader dashboard')) })
      ]),
      h('div', { class: 'nav' }, [home, navBtn('arcade', '🎮 Arcade')])
    ]));
    var main = h('main');
    main.appendChild(state.view === 'arcade' ? arcadeView() : state.view === 'tech' ? techView() : state.view === 'mgr' ? managerView() : dashboardView());
    root.appendChild(main);
    root.appendChild(live);
    window.scrollTo(0, 0);
  }

  root = document.getElementById('oto-root');
  render();
})();
</script>
</body>
