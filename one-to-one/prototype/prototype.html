<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESG 1-to-1 prototype</title>
<!--
  ESG Monthly Technician 1-to-1 - VISUAL PROTOTYPE ONLY.
  Entirely fictional people and data. Not connected to SharePoint; nothing is saved.
  Not production code and not for upload to Welcome. Open this file in any browser.

  Written so the later production frontend can reuse the structure inside Welcome:
  all styles are scoped under .oto, all text is set with textContent (never as HTML),
  there are no external resources, and the code sits in one mount function.
-->
<style>
  .oto {
    --navy: #1f3a5f; --navy-2: #2d527f; --ink: #1d2733; --muted: #5b6776; --line: #d9dee5;
    --bg: #f4f6f9; --card: #ffffff; --green: #1e7a46; --green-bg: #e7f4ec; --amber: #8a5a00;
    --amber-bg: #fff4d6; --red: #a4262c; --red-bg: #fde7e9; --blue-bg: #e8f0fa; --focus: #2b78d0;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; font-size: 15px;
    line-height: 1.45; color: var(--ink); background: var(--bg); min-height: 100vh;
  }
  .oto * { box-sizing: border-box; }
  .oto .proto-bar { background: #3b3b3b; color: #fff; font-size: 13px; padding: 6px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  .oto .proto-bar .roles button { background: transparent; color: #fff; border: 1px solid #888; border-radius: 4px; padding: 3px 10px; margin-left: 6px; cursor: pointer; font-size: 13px; }
  .oto .proto-bar .roles button[aria-pressed="true"] { background: #fff; color: #222; border-color: #fff; }
  .oto header.app { background: var(--navy); color: #fff; padding: 14px 16px; }
  .oto header.app h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .oto header.app p { margin: 2px 0 0; opacity: .85; font-size: 13px; }
  .oto main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .oto .narrow { max-width: 860px; margin: 0 auto; }
  .oto .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 14px; }
  .oto .card h2 { font-size: 17px; margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; }
  .oto .qnum { flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 13px; font-weight: 600; }
  .oto .hint { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
  .oto .guidance { background: var(--blue-bg); border-left: 4px solid var(--navy-2); padding: 8px 12px; font-size: 13px; margin: 6px 0 10px; border-radius: 0 6px 6px 0; }
  .oto label.field { display: block; font-weight: 600; font-size: 14px; margin: 10px 0 4px; }
  .oto textarea, .oto select, .oto input[type="date"] { width: 100%; font: inherit; color: inherit; border: 1px solid #b9c2cd; border-radius: 6px; padding: 8px 10px; background: #fff; }
  .oto textarea { min-height: 70px; resize: vertical; }
  .oto textarea:disabled, .oto select:disabled { background: #f1f3f6; color: #333; border-color: var(--line); }
  .oto :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .oto .choices { display: grid; gap: 8px; }
  .oto .choices.inline { grid-template-columns: repeat(auto-fit, minmax(110px, max-content)); }
  .oto .choices.scale { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .oto .choice { display: flex; flex-direction: column; gap: 2px; border: 1px solid #b9c2cd; border-radius: 6px; padding: 8px 12px; cursor: pointer; background: #fff; position: relative; }
  .oto .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .oto .choice .choice-title { font-weight: 600; }
  .oto .choice .choice-desc { font-size: 13px; color: var(--muted); }
  .oto .choice:has(input:checked) { border-color: var(--navy); background: var(--blue-bg); box-shadow: inset 0 0 0 1px var(--navy); }
  .oto .choice:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
  .oto .choice:has(input:disabled) { cursor: default; opacity: .8; }
  .oto .btn { font: inherit; font-weight: 600; border-radius: 6px; padding: 8px 16px; border: 1px solid var(--navy); background: #fff; color: var(--navy); cursor: pointer; }
  .oto .btn.primary { background: var(--navy); color: #fff; }
  .oto .btn.danger { border-color: var(--red); color: var(--red); }
  .oto .btn:disabled { opacity: .45; cursor: not-allowed; }
  .oto .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .oto .sticky { position: sticky; top: 0; z-index: 5; }
  .oto .status-bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
  .oto .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 12px; background: #e9ecf0; color: #333; white-space: nowrap; }
  .oto .chip.green { background: var(--green-bg); color: var(--green); }
  .oto .chip.amber { background: var(--amber-bg); color: var(--amber); }
  .oto .chip.red { background: var(--red-bg); color: var(--red); }
  .oto .chip.blue { background: var(--blue-bg); color: var(--navy); }
  .oto .feedback { background: #f3f6f2; border-left: 4px solid var(--green); padding: 8px 12px; margin-top: 10px; border-radius: 0 6px 6px 0; font-size: 14px; white-space: pre-wrap; }
  .oto .feedback b { display: block; font-size: 12px; color: var(--green); text-transform: uppercase; letter-spacing: .03em; }
  .oto .missing { border-left: 4px solid var(--red); background: var(--red-bg); padding: 10px 12px; border-radius: 0 6px 6px 0; }
  .oto .done { border-left: 4px solid var(--green); background: var(--green-bg); padding: 10px 12px; border-radius: 0 6px 6px 0; }
  .oto .exp { border: 1px solid var(--line); border-radius: 6px; padding: 12px; margin-top: 10px; }
  .oto .exp h3 { margin: 0; font-size: 15px; }
  .oto .answer { white-space: pre-wrap; background: #f7f8fa; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 4px 0 8px; min-height: 38px; }
  .oto .answer.empty { color: var(--muted); font-style: italic; }
  .oto .banner { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-weight: 600; }
  .oto .banner.amber { background: var(--amber-bg); color: var(--amber); border: 1px solid #f0d58a; }
  .oto .banner.info { background: var(--blue-bg); color: var(--navy); border: 1px solid #c4d6ee; }
  .oto .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .oto .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .oto .kpi .v { font-size: 26px; font-weight: 700; color: var(--navy); }
  .oto .kpi.month .v { font-size: 18px; padding-top: 6px; }
  .oto .kpi .l { font-size: 13px; color: var(--muted); }
  .oto .kpi.alert .v { color: var(--amber); }
  .oto .kpi.bad .v { color: var(--red); }
  .oto .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  .oto .tabs button { font: inherit; background: none; border: none; border-bottom: 3px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .oto .tabs button[aria-selected="true"] { color: var(--navy); border-bottom-color: var(--navy); }
  .oto .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 10px; }
  .oto .filters > div { min-width: 180px; }
  .oto .filters label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 2px; }
  .oto table.grid { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .oto table.grid th { text-align: left; font-size: 13px; color: var(--muted); background: #eef1f5; padding: 8px 10px; }
  .oto table.grid td { padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  .oto table.grid tr.req td { background: var(--amber-bg); }
  .oto .muted { color: var(--muted); }
  .oto .footer-note { color: var(--muted); font-size: 13px; margin-top: 14px; }
  .oto .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 14px; }
  .oto .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
  .oto .modal { background: #fff; border-radius: 8px; padding: 18px; max-width: 460px; width: 100%; }
  .oto .modal h3 { margin: 0 0 8px; }
  .oto .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #233; color: #fff; padding: 10px 16px; border-radius: 6px; z-index: 60; max-width: 90vw; }
  .oto .toast.err { background: var(--red); }
  .oto .meterwrap { margin-top: 8px; }
  .oto .meterwrap .lbl { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:3px; }
  .oto .meter { height: 8px; border-radius: 6px; background: #e6eaef; overflow: hidden; }
  .oto .meter > i { display:block; height:100%; width:0; background: linear-gradient(90deg,#2d7a46,#1e7a46); transition: width .25s ease; }
  .oto .meter.full > i { background: linear-gradient(90deg,#1e7a46,#0a6b2d); }
  .oto .countdown { font-size:12px; font-weight:600; padding:2px 9px; border-radius:12px; white-space:nowrap; }
  .oto .countdown.ok { background: var(--green-bg); color: var(--green); }
  .oto .countdown.soon { background: var(--amber-bg); color: var(--amber); }
  .oto .countdown.over { background: var(--red-bg); color: var(--red); }
  .oto .spark { display:flex; align-items:flex-end; gap:4px; height:46px; margin-top:6px; }
  .oto .spark .bar { flex:1; min-width:10px; border-radius:3px 3px 0 0; background: var(--navy-2); position:relative; display:flex; align-items:flex-end; justify-content:center; }
  .oto .spark .bar span { position:absolute; top:-16px; font-size:11px; color:var(--muted); }
  .oto .spark .bar b { font-size:10px; color:#fff; padding-bottom:2px; font-weight:600; }
  .oto .spark .bar.w5 { background:#a4262c; } .oto .spark .bar.w4 { background:#b4690e; } .oto .spark .bar.w3 { background:#2d7a46; } .oto .spark .bar.w2 { background:#3a7fb5; } .oto .spark .bar.w1 { background:#8a8f98; }
  .oto .ratebar { height:6px; border-radius:4px; background:#e6eaef; overflow:hidden; margin:6px 0 2px; }
  .oto .ratebar > i { display:block; height:100%; background:var(--navy-2); transition:width .2s ease; }
  .oto .collapse-head { cursor:pointer; user-select:none; display:flex; align-items:center; gap:8px; }
  .oto .collapse-head .tick { color: var(--green); font-weight:700; }
  @media (max-width: 700px) {
    .oto main { padding: 10px; }
    .oto table.grid thead { display: none; }
    .oto table.grid, .oto table.grid tbody, .oto table.grid tr, .oto table.grid td { display: block; width: 100%; }
    .oto table.grid tr { border-top: 6px solid var(--bg); }
    .oto table.grid td { border-top: none; padding: 4px 12px; }
    .oto table.grid td::before { content: attr(data-label); display: block; font-size: 12px; color: var(--muted); }
    .oto .sticky { position: static; }
  }
</style>
</head>
<body style="margin:0">
<div class="oto" id="oto-root"></div>
<script>
(function () {
  'use strict';

  // ---------------- fixed reference data (agreed wording) ----------------
  var WORKLOAD = [
    { value: 1, title: '1 – Very light', desc: 'Significantly below capacity' },
    { value: 2, title: '2 – Light', desc: 'Some spare capacity' },
    { value: 3, title: '3 – Manageable', desc: 'Appropriate workload' },
    { value: 4, title: '4 – Heavy', desc: 'Busy but manageable' },
    { value: 5, title: '5 – Excessive', desc: 'Struggling to manage' }
  ];
  var PROGRESS = [
    { value: 1, title: '1 – Not started', desc: 'No progress yet' },
    { value: 2, title: '2 – Early progress', desc: "Behind where I'd expect" },
    { value: 3, title: '3 – On track', desc: 'Progressing as expected' },
    { value: 4, title: '4 – Strong progress', desc: 'Ahead of expectations' },
    { value: 5, title: '5 – Fully met', desc: 'Achieved and evidenced' }
  ];
  var FOLLOW = [
    'Everything has been covered — no further discussion required at present.',
    'Quick, informal catch-up in the field.',
    'Arrange a dedicated 1-to-1 discussion.'
  ];
  var DEDICATED = FOLLOW[2];
  var YESNO = [{ value: 'Yes', title: 'Yes' }, { value: 'No', title: 'No' }];
  var TODAY = '2026-11-24';            // fictional "today" for the prototype
  var ME = 'Alex Morgan';              // fictional technician shown in technician view

  // ---------------- fictional data ----------------
  var MASTER_EXPECTATIONS = [
    { id: 11, title: 'Complete annual safety refresher training', measures: 'Course passed and certificate recorded by the end of Q4.', year: '2026/27', scope: 'Shared', tech: '', active: true },
    { id: 12, title: 'Keep instrument checks on schedule', measures: 'All assigned weekly checks completed and recorded on time.', year: '2026/27', scope: 'Shared', tech: '', active: true },
    { id: 13, title: 'Mentor a newer team member', measures: 'Regular buddy sessions held; mentee signs off two practical tasks.', year: '2026/27', scope: 'Individual', tech: 'Alex Morgan', active: true },
    { id: 14, title: 'Achieve task supervisor qualification', measures: 'Assessment passed; first supervised task completed.', year: '2026/27', scope: 'Individual', tech: 'Sam Patel', active: true },
    { id: 9, title: 'Update local work instructions', measures: 'Three instructions reviewed and reissued.', year: '2025/26', scope: 'Shared', tech: '', active: false }
  ];

  function snapshotFor(tech) {
    return MASTER_EXPECTATIONS.filter(function (e) {
      return e.active && (e.scope === 'Shared' || e.tech === tech);
    }).map(function (e) {
      return { id: e.id, title: e.title, measures: e.measures, year: e.year };
    });
  }

  function blankAnswers(snap) {
    return {
      q1: '', q2: { issue: '', impact: '', tried: '', support: '' },
      q3: null, q3c: '', q4: null, q4d: '', q5: null, q5d: '', q6: null, q6what: '', q6why: '', q7: '',
      q8: snap.map(function (e) { return { id: e.id, rating: null, comment: '' }; }),
      q9: null
    };
  }

  function sampleAnswers(snap, workload, follow, variant) {
    var a = blankAnswers(snap);
    a.q1 = variant === 1
      ? 'Closed out the outage survey backlog two days early.\nGood feedback from the shift team on the handover notes.'
      : 'Completed all routine checks on time and helped cover a colleague\'s area for a week.';
    a.q2 = variant === 1
      ? { issue: 'Waiting on spare parts for one monitor.', impact: 'Using a loan unit, which slows checks slightly.', tried: 'Chased stores twice.', support: 'Help escalating the order.' }
      : { issue: '', impact: '', tried: '', support: '' };
    a.q3 = workload;
    a.q3c = workload >= 4 ? 'Busy with outage support plus routine work.' : '';
    a.q4 = 'No';
    a.q5 = variant === 1 ? 'Yes' : 'No';
    a.q5d = variant === 1 ? 'Annual leave 14–18 December. Training course on 8 January.' : '';
    a.q6 = variant === 1 ? 'Yes' : 'No';
    a.q6what = variant === 1 ? 'Supervisor qualification course.' : '';
    a.q6why = variant === 1 ? 'To take on supervising tasks next year.' : '';
    a.q7 = variant === 1 ? 'The new rota has made planning much easier – thanks.' : '';
    a.q8 = snap.map(function (e, i) {
      return { id: e.id, rating: [3, 4, 2][i % 3], comment: ['Booked for next month.', 'All checks done this month.', 'Two sessions so far.'][i % 3] };
    });
    a.q9 = follow;
    return a;
  }

  function emptyFeedback() {
    return { q1: '', q2: '', q3: '', q4: '', q5: '', q6: '', q7: '', q9: '', overall: '', exp: {}, followOverride: '', meeting: '', actions: '', actionsDue: '', actionsStatus: 'None' };
  }

  var nextId = 100;
  function review(tech, month, due, state, opts) {
    opts = opts || {};
    var snap = snapshotFor(tech);
    var r = {
      id: nextId++, tech: tech, month: month, due: due, state: state,
      draft: !!opts.draft, submittedOn: opts.submittedOn || '', late: !!opts.late,
      snapshot: snap,
      answers: opts.answers ? opts.answers(snap) : blankAnswers(snap),
      fb: emptyFeedback(), released: false
    };
    if (opts.fb) {
      opts.fb(r.fb, snap);
    }
    r.released = state === 'Completed' || state === 'Closed - Not Submitted';
    return r;
  }

  var REVIEWS = [
    review('Alex Morgan', '2026-11', '2026-11-30', 'Open', { draft: true, answers: function (s) {
      var a = blankAnswers(s);
      a.q1 = 'Finished the instrument check backlog.';
      a.q3 = 3;
      return a;
    } }),
    review('Sam Patel', '2026-11', '2026-11-30', 'Submitted', { submittedOn: '2026-11-18', answers: function (s) { return sampleAnswers(s, 4, DEDICATED, 1); } }),
    review('Jordan Lee', '2026-11', '2026-11-30', 'Completed', { submittedOn: '2026-11-10', answers: function (s) { return sampleAnswers(s, 3, FOLLOW[1], 2); },
      fb: function (fb) { fb.overall = 'Solid month.'; fb.actions = '• Book refresher course – Jordan – by 10/12'; fb.actionsDue = '2026-12-10'; fb.actionsStatus = 'Open'; } }),
    review('Casey Brooks', '2026-11', '2026-11-30', 'Open', {}),
    review('Riley Evans', '2026-11', '2026-11-30', 'Submitted', { submittedOn: '2026-11-21', answers: function (s) { return sampleAnswers(s, 2, FOLLOW[0], 2); } }),
    review('Taylor Reed', '2026-11', '2026-11-30', 'Open', { draft: true }),
    review('Alex Morgan', '2026-10', '2026-10-31', 'Completed', { submittedOn: '2026-10-27', answers: function (s) { return sampleAnswers(s, 3, FOLLOW[1], 1); },
      fb: function (fb, snap) {
        fb.q1 = 'Great work on the backlog – noticed by the shift team too.';
        fb.q2 = 'I\'ve escalated the parts order with stores.';
        fb.q3 = 'Agree – manageable. Tell me early if outage work builds up.';
        fb.q4 = 'Thanks – my door is always open.';
        fb.q5 = 'Leave noted on the planner.';
        fb.q6 = 'Supported – let\'s book the course in the new year.';
        fb.q7 = 'Thanks, appreciated.';
        fb.q9 = 'Quick catch-up in the field next week.';
        fb.overall = 'A strong month. Keep the mentoring going.';
        snap.forEach(function (e) { fb.exp[e.id] = 'Good progress – keep it up.'; });
        fb.actions = '• Book supervisor course – Alex – by 15/12';
        fb.actionsDue = '2026-12-15'; fb.actionsStatus = 'Open';
      } }),
    review('Sam Patel', '2026-10', '2026-10-31', 'Completed', { submittedOn: '2026-10-29', answers: function (s) { return sampleAnswers(s, 4, FOLLOW[1], 2); },
      fb: function (fb) { fb.actions = '• Arrange buddy shifts – Team Leader – by 20/11'; fb.actionsDue = '2026-11-20'; fb.actionsStatus = 'Open'; } }),
    review('Jordan Lee', '2026-10', '2026-10-31', 'Completed', { submittedOn: '2026-10-20', answers: function (s) { return sampleAnswers(s, 3, FOLLOW[0], 2); } }),
    review('Casey Brooks', '2026-10', '2026-10-31', 'Closed - Not Submitted', {}),
    review('Riley Evans', '2026-10', '2026-10-31', 'Completed', { submittedOn: '2026-11-02', late: true, answers: function (s) { return sampleAnswers(s, 2, FOLLOW[0], 2); } }),
    review('Taylor Reed', '2026-10', '2026-10-31', 'Completed', { submittedOn: '2026-10-24', answers: function (s) { return sampleAnswers(s, 5, DEDICATED, 1); } })
  ];
  var ACTIVE_TECHS = ['Alex Morgan', 'Sam Patel', 'Jordan Lee', 'Casey Brooks', 'Riley Evans', 'Taylor Reed'];

  // ---------------- small DOM helpers (text only, never HTML) ----------------
  var uid = 0;
  function h(tag, attrs, children) {
    var e = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) { return; }
        if (k === 'class') { e.className = v; }
        else if (k === 'text') { e.textContent = String(v); }
        else if (k.indexOf('on') === 0) { e.addEventListener(k.substring(2), v); }
        else { e.setAttribute(k, v === true ? '' : String(v)); }
      });
    }
    (Array.isArray(children) ? children : [children]).forEach(function (c) {
      if (c === null || c === undefined || c === false) { return; }
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }
  function nid(p) { uid += 1; return p + '-' + uid; }
  function fmtDate(iso) {
    if (!iso) { return ''; }
    var d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function fmtLongDate(iso) {
    var d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  function monthLabel(key) {
    var d = new Date(key + '-01T12:00:00');
    return d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  }
  function isOverdue(r) { return r.state === 'Open' && TODAY > r.due; }
  function followOf(r) { return r.fb.followOverride || (r.state === 'Open' ? '' : r.answers.q9) || ''; }

  function daysLeft(r) { return Math.ceil((new Date(r.due + 'T23:59:59') - new Date(TODAY + 'T12:00:00')) / 86400000); }
  function progressOf(a) {
    var items = [];
    items.push(!!(a.q1 && a.q1.trim()));
    items.push(!!a.q3);
    items.push(!!a.q4); if (a.q4 === 'Yes') { items.push(!!(a.q4d && a.q4d.trim())); }
    items.push(!!a.q5); if (a.q5 === 'Yes') { items.push(!!(a.q5d && a.q5d.trim())); }
    items.push(!!a.q6); if (a.q6 === 'Yes') { items.push(!!(a.q6what && a.q6what.trim())); }
    a.q8.forEach(function (x) { items.push(!!x.rating); });
    items.push(!!a.q9);
    var done = items.filter(Boolean).length;
    return { total: items.length, done: done, pct: Math.round(done / items.length * 100) };
  }
  function workloadHistory(tech) {
    return REVIEWS.filter(function (r) { return r.tech === tech && r.answers.q3; })
      .sort(function (x, y) { return x.month < y.month ? -1 : 1; })
      .map(function (r) { return { month: r.month, score: r.answers.q3 }; });
  }

  var root, live, state = { role: 'tech', view: 'tech', reviewId: null, tab: 'reviews', month: '2026-11', tech: '' };

  function toast(msg, isErr) {

      qCard(4, 'Wellbeing and support', null, [ans(hasAnswers ? yn(a.q4, a.q4d) : ''), fbBox('q4')]),
      qCard(5, 'Upcoming planning', null, [ans(hasAnswers ? yn(a.q5, a.q5d) : ''), fbBox('q5')]),
      qCard(6, 'Development, training and aspirations', null, [ans(hasAnswers ? yn(a.q6, a.q6what ? 'What: ' + a.q6what + (a.q6why ? '\nWhy: ' + a.q6why : '') : '') : ''), fbBox('q6')]),
      qCard(7, 'Feedback for line manager', null, [ans(a.q7 && hasAnswers ? a.q7 : ''), fbBox('q7', 'Your acknowledgement / response')]),
      qCard(8, 'Appraisal expectations', 'Titles and measures come from the snapshot taken when this month\'s review was created.', r.snapshot.map(function (e) {
        var x = a.q8.find(function (q) { return q.id === e.id; }) || {};
        var p = PROGRESS.find(function (pp) { return pp.value === x.rating; });
        return h('div', { class: 'exp' }, [
          h('h3', { text: e.title }), h('p', { class: 'hint', text: e.measures + ' (' + e.year + ')' }),
          ans(hasAnswers ? (p ? p.title + ' – ' + p.desc : 'Not rated') + (x.comment ? '\n' + x.comment : '') : ''),
          textBox('Your feedback', fb.exp[e.id], function (v) { fb.exp[e.id] = v; }, false, null, 2)
        ]);
      })),
      qCard(9, 'Follow-up', null, [ans(hasAnswers ? 'Technician preference: ' + (a.q9 || '(not answered)') : ''), fbBox('q9', 'Your comment')])
    ];

    var followSel = h('select', { id: nid('s'), onchange: function () { fb.followOverride = followSel.value; } },
      [h('option', { value: '', text: 'Accept technician\'s preference' })].concat(FOLLOW.map(function (f) { var o = h('option', { value: f, text: f }); o.selected = fb.followOverride === f; return o; })));
    var meeting = h('input', { type: 'date', id: nid('d'), onchange: function () { fb.meeting = meeting.value; } }); meeting.value = fb.meeting;
    var actDue = h('input', { type: 'date', id: nid('d'), onchange: function () { fb.actionsDue = actDue.value; } }); actDue.value = fb.actionsDue;
    var actStatus = h('select', { id: nid('s'), onchange: function () { fb.actionsStatus = actStatus.value; } },
      ['None', 'Open', 'Done'].map(function (s) { var o = h('option', { value: s, text: s }); o.selected = fb.actionsStatus === s; return o; }));

    sections.push(h('section', { class: 'card' }, [
      h('h2', { text: 'Overall, follow-up and agreed actions' }),
      textBox('Overall feedback', fb.overall, function (v) { fb.overall = v; }, false, null, 3),
      h('div', { class: 'two' }, [
        h('div', null, [h('label', { class: 'field', for: followSel.id, text: 'Follow-up decision (override if a meeting is needed)' }), followSel]),
        h('div', null, [h('label', { class: 'field', for: meeting.id, text: '1-to-1 meeting date (optional)' }), meeting])
      ]),
      textBox('Agreed actions (one per line – what, who, by when)', fb.actions, function (v) { fb.actions = v; }, false, '• Book refresher course – Technician – by 15/12', 3),
      h('div', { class: 'two' }, [
        h('div', null, [h('label', { class: 'field', for: actDue.id, text: 'Earliest action due' }), actDue]),
        h('div', null, [h('label', { class: 'field', for: actStatus.id, text: 'Actions status' }), actStatus])
      ])
    ]));

    var canComplete = r.state === 'Submitted';
    var canClose = r.state === 'Open' && TODAY > r.due;
    var actions = h('div', { class: 'btn-row' }, [
      h('button', { class: 'btn', type: 'button', text: 'Save feedback', onclick: function () {
        toast(r.released ? 'Saved – already released, so the technician can see this change (prototype).' : 'Saved – not visible to the technician until you complete the review (prototype).');
      } }),
      h('button', { class: 'btn primary', type: 'button', text: 'Complete & release', disabled: !canComplete, title: canComplete ? null : 'Only submitted reviews can be completed', onclick: function () {
        confirmBox('Complete this review?', 'Your feedback will be released to ' + r.tech + ' and they will be emailed.', 'Complete & release', function () {
          r.state = 'Completed'; r.released = true; toast('Completed – feedback released (prototype).'); render();
        });
      } }),
      h('button', { class: 'btn danger', type: 'button', text: 'Close – not submitted', disabled: !canClose, title: canClose ? null : 'Only possible after the deadline for a review that was not submitted', onclick: function () {
        confirmBox('Close as not submitted?', r.tech + ' will no longer be able to submit this review.', 'Close review', function () {
          r.state = 'Closed - Not Submitted'; r.released = true; toast('Closed (prototype).'); render();
        });
      } }),
      h('button', { class: 'btn', type: 'button', text: 'Back to dashboard', onclick: function () { state.view = 'dash'; render(); } })
    ]);

    var f = followOf(r);
    return h('div', { class: 'narrow' }, [
      h('div', { class: 'card sticky' }, [
        h('div', { class: 'status-bar' }, [
          h('div', null, [h('strong', { text: r.tech + ' – ' + monthLabel(r.month) + ' ' }), chipFor(r),
            h('div', { class: 'hint', style: 'margin:4px 0 0', text: r.submittedOn ? 'Submitted ' + fmtDate(r.submittedOn) + (r.late ? ' (late)' : '') : 'Deadline ' + fmtLongDate(r.due) })]),
          actions
        ])
      ]),
      f === DEDICATED ? h('div', { class: 'banner amber', text: 'Dedicated 1-to-1 discussion requested' }) : null,
      r.released ? h('div', { class: 'banner info', text: 'Feedback already released – any change you save is visible to the technician straight away. Record the reason in the correction log.' }) : null
    ].concat(sections));
  }

  // ---------------- shell ----------------
  function render() {
    root.textContent = '';
    live = h('div', { class: 'sr', 'aria-live': 'polite', style: 'position:absolute;left:-9999px' });
    function roleBtn(role, label) {
      return h('button', { type: 'button', 'aria-pressed': state.role === role ? 'true' : 'false', text: label, onclick: function () {
        state.role = role; state.view = role === 'tech' ? 'tech' : 'dash'; state.reviewId = null; render();
      } });
    }
    root.appendChild(h('div', { class: 'proto-bar' }, [
      h('span', { text: 'PROTOTYPE – fictional people and data. Not connected to SharePoint; nothing is saved. "Today" is ' + fmtDate(TODAY) + '.' }),
      h('span', { class: 'roles' }, ['View as:', roleBtn('tech', 'Technician (' + ME + ')'), roleBtn('tl', 'Team Leader')])
    ]));
    root.appendChild(h('header', { class: 'app' }, [
      h('h1', { text: 'ESG Technician 1-to-1' }),
      h('p', { text: state.role === 'tech' ? 'My monthly 1-to-1' : (state.view === 'mgr' ? 'Review and feedback' : 'Team Leader dashboard') })
    ]));
    var main = h('main');
    main.appendChild(state.view === 'tech' ? techView() : state.view === 'mgr' ? managerView() : dashboardView());
    root.appendChild(main);
    root.appendChild(live);
    window.scrollTo(0, 0);
  }

  root = document.getElementById('oto-root');
  render();
})();
</script>
</body>
</html>
