<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESG Competency Hub – Control centre</title>
<!--@SHARED-->
<style>
  :root {
    --rail: #0b2545; --rail-hi: #13315c; --rail-ink: #c9d6e8; --accent: #0f7c8c; --accent-ink: #fff;
    --ink: #1b2430; --muted: #5d6b7c; --line: #e2e7ee; --bg: #f3f5f8; --card: #fff;
    --late: #b42318; --late-bg: #fef3f2; --soon: #915a00; --soon-bg: #fff6e0; --ok: #1a7f4b; --ok-bg: #ecf8f1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 "Segoe UI", system-ui, Arial, sans-serif; color: var(--ink); background: var(--bg); }
  .pv-app { display: grid; grid-template-columns: 252px 1fr; min-height: calc(100vh - 31px); }
  button { font: inherit; cursor: pointer; }

  /* Left rail */
  .rail { background: var(--rail); color: var(--rail-ink); display: flex; flex-direction: column; padding: 18px 12px; gap: 4px; }
  .brand { display: flex; gap: 10px; align-items: center; padding: 0 8px 18px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 10px; }
  .mark { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, #14a3b8, #0f7c8c); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; letter-spacing: .5px; }
  .brand b { color: #fff; font-size: 14.5px; display: block; line-height: 1.2; } .brand small { font-size: 11.5px; opacity: .75; }
  .nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 7px; color: var(--rail-ink); text-decoration: none; font-size: 13.5px; }
  .nav a:hover { background: var(--rail-hi); color: #fff; }
  .nav a[aria-current] { background: var(--rail-hi); color: #fff; box-shadow: inset 3px 0 0 #14a3b8; }
  .nav svg { width: 17px; height: 17px; flex: none; }
  .nav .count { white-space: nowrap; margin-left: auto; background: rgba(255,255,255,.12); border-radius: 9px; padding: 0 7px; font-size: 11.5px; }
  .nav-h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .55; padding: 16px 10px 6px; }
  .area-link .pip { width: 7px; height: 7px; border-radius: 50%; background: #3fb984; flex: none; }
  .area-link .pip.l { background: #ff6b5e; }
  .rail .foot { margin-top: auto; padding: 12px 10px 0; font-size: 11.5px; opacity: .6; border-top: 1px solid rgba(255,255,255,.08); }

  /* Main */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .top { display: flex; align-items: center; gap: 14px; padding: 12px 32px; background: var(--card); border-bottom: 1px solid var(--line); }
  .crumb { color: var(--muted); font-size: 13px; } .crumb b { color: var(--ink); }
  .env { background: var(--soon-bg); color: var(--soon); font-size: 11.5px; font-weight: 600; border-radius: 4px; padding: 2px 8px; }
  .me { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .me b { color: var(--ink); font-weight: 600; }
  .me { white-space: nowrap; } .me svg { width: 20px; height: 20px; color: var(--muted); margin-right: 6px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #dbe9f6; color: var(--rail); display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
  .content { padding: 26px 32px 40px; display: flex; flex-direction: column; gap: 22px; max-width: 1640px; width: 100%; }
  .head { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
  .head h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.2px; }
  .head p { margin: 4px 0 0; color: var(--muted); }
  .head .actions { margin-left: auto; display: flex; gap: 10px; }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 7px; padding: 8px 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
  .btn svg { width: 15px; height: 15px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:focus-visible, .nav a:focus-visible, .row:focus-visible { outline: 3px solid #14a3b8; outline-offset: 2px; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; }
  .kpi .lbl { color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .kpi .num { font-size: 30px; font-weight: 600; line-height: 1; letter-spacing: -.5px; }
  .kpi .sub { font-size: 12.5px; color: var(--muted); }
  .kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, var(--accent)); }

  .grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .panel > header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .panel > header h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .panel > header .meta { color: var(--muted); font-size: 12.5px; }
  .panel > header a { margin-left: auto; color: var(--accent); font-weight: 600; font-size: 13px; text-decoration: none; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 9px 18px; background: #fafbfc; border-bottom: 1px solid var(--line); }
  td { padding: 11px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: #f7fafc; cursor: pointer; }
  .ttl { font-weight: 600; } .ref { color: var(--muted); font-size: 12px; }
  .chip { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .chip.late { background: var(--late-bg); color: var(--late); } .chip.soon { background: var(--soon-bg); color: var(--soon); } .chip.later { background: #eef2f6; color: #4a5868; }
  .note { font-size: 12px; color: var(--muted); }
  .areatag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; } .areatag i { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }

  .alist { list-style: none; margin: 0; padding: 4px 0; }
  .alist li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .alist li:last-child { border-bottom: 0; }
  .alist .nm { font-weight: 600; } .alist .st { font-size: 12.5px; color: var(--muted); text-align: right; }
  .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: #e9eef3; display: flex; overflow: hidden; }
  .bar span { display: block; height: 100%; }
  .todo { list-style: none; margin: 0; padding: 0; }
  .todo li { display: flex; gap: 12px; align-items: flex-start; padding: 11px 18px; border-bottom: 1px solid var(--line); }
  .todo li:last-child { border-bottom: 0; }
  .tag { flex: none; font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--accent); background: #e6f4f6; border-radius: 4px; padding: 2px 7px; margin-top: 1px; }
  .tag.late { color: var(--late); background: var(--late-bg); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .empty { padding: 18px; color: var(--muted); }
  @media (max-width: 1280px) { .grid, .two { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 900px) { .pv-app { grid-template-columns: 1fr; } .rail { display: none; } .content, .top { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<div id="pv"></div>
<script>
(function () {
  var I = {

    var kpis = h('div', { class: 'kpis' }, k.map(function (x) { return h('div', { class: 'kpi', style: '--c:' + x[3] }, h('span', { class: 'lbl', text: x[0] }), h('span', { class: 'num', text: String(x[1]) }), h('span', { class: 'sub', text: x[2] })); }));

        h('ul', { class: 'alist' }, D.areas.map(function (a) {
          var max = 22;

        })));
