<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESG Competency Hub – Operations board</title>
<!--@SHARED-->
<style>
  :root {
    --bg: #0d141c; --panel: #151f2a; --panel-2: #1b2734; --line: #26364a; --ink: #e8eef5; --muted: #93a4b8;
    --accent: #4cc2ff; --late: #ff6b5f; --late-bg: rgba(255,107,95,.12); --soon: #f5b94a; --soon-bg: rgba(245,185,74,.12);
    --ok: #4fd18b; --ok-bg: rgba(79,209,139,.12);
    --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Segoe UI", system-ui, Arial, sans-serif; }
  button { font: inherit; cursor: pointer; }
  .pv-app { min-height: calc(100vh - 31px); display: flex; flex-direction: column; }

  .top { display: flex; align-items: center; gap: 18px; padding: 12px 28px; background: #0a1017; border-bottom: 1px solid var(--line); }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo .sq { width: 28px; height: 28px; border: 2px solid var(--accent); border-radius: 6px; display: grid; place-items: center; font: 700 12px var(--mono); color: var(--accent); }
  .logo b { font-size: 15px; letter-spacing: .02em; } .logo small { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .tabs { display: flex; gap: 4px; margin-left: 18px; }
  .tabs a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 13.5px; }
  .tabs a[aria-current] { background: var(--panel-2); color: var(--ink); }
  .who { margin-left: auto; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
  .who b { color: var(--ink); font-weight: 600; }
  .env { font: 600 11px var(--mono); color: var(--soon); border: 1px solid rgba(245,185,74,.5); border-radius: 4px; padding: 2px 7px; }

  .health { display: flex; gap: 26px; padding: 9px 28px; background: #101923; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .health span { display: inline-flex; align-items: center; gap: 7px; }
  .health i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
  .health .clock { margin-left: auto; font-family: var(--mono); color: var(--ink); }

  .body { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 0; }
  .board { padding: 24px 28px 32px; }
  .hello { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .hello h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .hello p { margin: 2px 0 0; color: var(--muted); }
  .hello .btns { margin-left: auto; display: flex; gap: 10px; }
  .btn { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 9px 16px; font-weight: 600; }
  .btn.primary { background: var(--accent); color: #04121c; border-color: var(--accent); }
  .btn:focus-visible, a:focus-visible, .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  .tot { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .tot span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .tot b { display: block; font: 600 32px/1.1 var(--mono); margin-top: 6px; }

  .h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; }
  .h2 h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
  .h2 .key { margin-left: auto; display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .h2 .key span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--c); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; position: relative; }
  .tile:hover { border-color: #3b536e; background: #18232f; }
  .tile .row1 { display: flex; align-items: center; gap: 8px; }
  .tile .code { font: 700 11.5px var(--mono); color: var(--muted); }
  .tile .state { margin-left: auto; font: 700 10.5px var(--mono); letter-spacing: .06em; padding: 2px 7px; border-radius: 4px; }
  .state.attn { color: var(--late); background: var(--late-bg); } .state.watch { color: var(--soon); background: var(--soon-bg); } .state.ok { color: var(--ok); background: var(--ok-bg); }
  .tile .nm { font-size: 16px; font-weight: 600; line-height: 1.2; }
  .tile .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
  .tile .nums div { display: flex; flex-direction: column; }
  .tile .nums b { font: 600 20px var(--mono); }
  .tile .nums small { color: var(--muted); font-size: 11.5px; }
  .tile .mtg { font-size: 12.5px; color: var(--muted); }
  .tile .mtg.warn { color: var(--soon); }
  .tile::before { content: ""; position: absolute; left: -1px; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: var(--c); }

  .side { background: #111a24; border-left: 1px solid var(--line); padding: 24px 22px 32px; display: flex; flex-direction: column; gap: 26px; }
  .q { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .q li { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .q .t { font-weight: 600; } .q .s { color: var(--muted); font-size: 12px; grid-column: 1; }
  .q .d { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 600 12px var(--mono); padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
  .d.late { color: var(--late); background: var(--late-bg); } .d.soon { color: var(--soon); background: var(--soon-bg); } .d.later { color: var(--muted); background: var(--panel-2); }
  .q.attn li { border-left: 3px solid var(--soon); }
  .tl { display: flex; flex-direction: column; gap: 0; border-left: 2px solid var(--line); margin-left: 6px; }
  .tl div { position: relative; padding: 0 0 14px 16px; }
  .tl div::before { content: ""; position: absolute; left: -6px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
  .tl b { display: block; font-size: 13.5px; } .tl small { color: var(--muted); font-size: 12px; } .tl em { font: normal 600 11.5px var(--mono); color: var(--accent); }
  .notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .note { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
  .note .code { font: 700 11px var(--mono); color: var(--accent); } .note small { color: var(--muted); font-size: 12px; }
  @media (max-width: 1300px) { .body { grid-template-columns: 1fr; } .side { border-left: 0; border-top: 1px solid var(--line); } .totals { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 800px) { .tabs { display: none; } .board, .side, .top, .health { padding-left: 16px; padding-right: 16px; } .health { flex-wrap: wrap; gap: 10px; } }
</style>
</head>
<body>
<div id="pv"></div>
<script>
window.renderDesign = function (root, D) {
  var top = h('header', { class: 'top' },
    h('div', { class: 'logo' }, h('span', { class: 'sq', text: 'CH' }), h('b', { text: 'Competency Hub' }), h('small', { text: 'ESG · Dungeness B' })),
    h('nav', { class: 'tabs', 'aria-label': 'Main' }, ['Board', 'My actions', 'Notices', 'Meetings'].concat(D.isMgmt ? ['Management'] : []).map(function (x, i) { return h('a', { href: '#', 'aria-current': i === 0 ? 'page' : null, text: x }); })),
    h('div', { class: 'who' }, h('span', { class: 'env', text: 'TEST DATA' }), h('span', null, h('b', { text: D.person.full }), ' · ' + D.person.role)));
  var health = h('div', { class: 'health', role: 'status' },
    h('span', null, h('i'), 'Changes are being recorded normally'),
    h('span', null, h('i'), 'Reminders sent at 06:00'),
    h('span', null, h('i'), 'Last checked 08:45'),
    h('span', { class: 'clock', text: 'FRI 23 OCT 2026 · 09:02' }));

  function areaState(a) { return a.late >= 3 || a.stale ? ['attn', 'ATTENTION', '#ff6b5f'] : a.late ? ['watch', 'WATCH', '#f5b94a'] : ['ok', 'ON TRACK', '#4fd18b']; }

  var tot = D.isMgmt
    ? [['Open', D.group.open], ['Late', D.group.late], ['Due 7 days', D.group.soon], ['Areas needing attention', D.areas.filter(function (a) { return areaState(a)[0] === 'attn'; }).length]]
    : [['My open', D.mine.length], ['My late', D.late.length], ['My due 7 days', D.soon.length], ['Late in my areas', D.areas.reduce(function (t, a) { return t + a.late; }, 0)]];

  var board = h('section', { class: 'board' },
    h('div', { class: 'hello' }, h('div', null, h('h1', { text: D.greeting }), h('p', { text: D.isMgmt ? 'Status of all ten competency areas' : 'Status of your ' + D.areas.length + ' competency areas' })),
      h('div', { class: 'btns' }, h('button', { class: 'btn', type: 'button', text: 'Post a notice' }), h('button', { class: 'btn primary', type: 'button', text: '+ Raise an action' }))),
    h('div', { class: 'totals' }, tot.map(function (t, i) { return h('div', { class: 'tot' }, h('span', { text: t[0] }), h('b', { style: i === 1 && t[1] ? 'color:var(--late)' : i === 3 && t[1] ? 'color:var(--soon)' : '', text: String(t[1]) })); })),
    h('div', { class: 'h2' }, h('h2', { text: 'Area status' }), h('div', { class: 'key' }, h('span', { style: '--c:#ff6b5f', text: 'Attention' }), h('span', { style: '--c:#f5b94a', text: 'Watch' }), h('span', { style: '--c:#4fd18b', text: 'On track' }))),
    h('div', { class: 'tiles' }, D.areas.map(function (a) {
      var s = areaState(a);
      return h('div', { class: 'tile', tabindex: '0', role: 'link', style: '--c:' + s[2] },
        h('div', { class: 'row1' }, h('span', { class: 'code', text: a.key }), h('span', { class: 'state ' + s[0], text: s[1] })),
        h('div', { class: 'nm', text: a.name }),
        h('div', { class: 'nums' },
          h('div', null, h('b', { text: String(a.open) }), h('small', { text: 'open' })),
          h('div', null, h('b', { style: a.late ? 'color:var(--late)' : '', text: String(a.late) }), h('small', { text: 'late' })),
          h('div', null, h('b', { text: String(a.flagged) }), h('small', { text: 'to discuss' }))),
        h('div', { class: 'mtg' + (a.stale ? ' warn' : '') , text: a.stale ? 'No meeting since 2 Sep' : a.nextText }));
    })),
    h('div', { class: 'h2', style: 'margin-top:26px' }, h('h2', { text: 'Latest notices' })),
    h('div', { class: 'notes' }, D.notices.slice(0, 4).map(function (n) {
      return h('div', { class: 'note' }, h('span', { class: 'code', text: n.area.key + (n.important ? ' · IMPORTANT' : '') }), h('b', { text: n.title }), h('small', { text: n.by + ' · ' + n.when }));
    })));

  var side = h('aside', { class: 'side' },
    D.manage.length ? h('div', null, h('div', { class: 'h2' }, h('h2', { text: D.isMgmt ? 'Needs your attention' : 'For you to manage' })),
      h('ul', { class: 'q attn' }, D.manage.slice(0, 4).map(function (m) { return h('li', null, h('span', { class: 't', text: m.text }), h('span', { class: 's', text: m.kind })); }))) : null,
    h('div', null, h('div', { class: 'h2' }, h('h2', { text: D.isMgmt ? 'Your own actions' : 'Your actions' })),
      h('ul', { class: 'q' }, D.mine.slice(0, 5).map(function (a) { return h('li', null, h('span', { class: 't', text: a.title }), h('span', { class: 's', text: a.area.name + ' · ' + a.ref }), h('span', { class: 'd ' + a.band, text: a.due.replace('Due ', '').toUpperCase() })); }))),
    h('div', null, h('div', { class: 'h2' }, h('h2', { text: 'Coming up' })),
      h('div', { class: 'tl' }, D.meetings.slice(0, 3).map(function (m) { return { date: m.date, when: m.when, t: m.area.name + ' meeting', s: m.time + ' · ' + m.items + ' agenda items' }; })
        .concat(D.dates.slice(0, 2).map(function (x) { return { date: x.date, when: x.when, t: x.title, s: x.area.name }; }))
        .sort(function (a, b) { return a.date - b.date; })
        .map(function (x) { return h('div', null, h('em', { text: x.when.toUpperCase() }), h('b', { text: x.t }), h('small', { text: x.s })); }))));

  root.appendChild(top); root.appendChild(health);
  root.appendChild(h('div', { class: 'body' }, board, side));
};
</script>
<!--@SWITCH-->
</body>
</html>
