<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESG Competency Hub – Morning brief</title>
<!--@SHARED-->
<style>
  :root {
    --paper: #f7f4ee; --card: #fffdf9; --ink: #1f1c17; --muted: #6b6457; --line: #ddd5c6; --rule: #1f1c17;
    --accent: #b0502a; --accent-soft: #f6e6dc; --late: #a3271b; --soon: #8a5a0b; --ok: #3d6b4c;
    --serif: Georgia, Cambria, "Times New Roman", serif; --sans: "Segoe UI", system-ui, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); }
  button { font: inherit; cursor: pointer; }
  .wrap { max-width: 1560px; margin: 0 auto; padding: 0 48px 56px; }

  .mast { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; padding: 22px 0 12px; border-bottom: 3px double var(--rule); }
  .mast .l { font-size: 12.5px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .mast .c { text-align: center; }
  .mast .c b { font: 700 30px/1 var(--serif); letter-spacing: -.3px; display: block; }
  .mast .c small { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .mast .r { justify-self: end; display: flex; gap: 14px; align-items: center; font-size: 13px; color: var(--muted); }
  .mast .r b { color: var(--ink); font-weight: 600; }
  .env { border: 1px solid var(--accent); color: var(--accent); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; }
  .menu { display: flex; gap: 30px; justify-content: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .menu a { color: var(--ink); text-decoration: none; padding-bottom: 2px; }
  .menu a[aria-current] { border-bottom: 2px solid var(--accent); font-weight: 600; }

  .lede { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 56px; padding: 40px 0 34px; border-bottom: 1px solid var(--line); align-items: end; }
  .lede h1 { font: 400 52px/1.08 var(--serif); margin: 0 0 16px; letter-spacing: -.8px; }
  .lede p { font: 400 21px/1.5 var(--serif); margin: 0; max-width: 46ch; color: #2d2922; }
  .lede p strong { color: var(--accent); font-weight: 700; }
  .cta { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .btn { border: 1.5px solid var(--ink); background: transparent; color: var(--ink); padding: 11px 22px; font-weight: 600; letter-spacing: .02em; }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .figs { display: flex; gap: 34px; margin-top: 4px; }
  .fig b { font: 400 44px/1 var(--serif); display: block; }
  .fig span { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

  .cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 56px; padding-top: 34px; }
  .sec { margin-bottom: 40px; }
  .sec-h { display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid var(--rule); padding-bottom: 8px; margin-bottom: 4px; }
  .sec-h .no { font: italic 400 15px var(--serif); color: var(--accent); }
  .sec-h h2 { font: 700 24px/1.2 var(--serif); margin: 0; }
  .sec-h a { margin-left: auto; color: var(--accent); font-size: 13px; text-decoration: none; font-weight: 600; }

  .item { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 22px; padding: 18px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .stamp { text-align: center; border-right: 1px solid var(--line); padding-right: 18px; }
  .stamp b { display: block; font: 400 34px/1 var(--serif); }
  .stamp span { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .item .t { font: 600 18px/1.3 var(--serif); }
  .item .m { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .status { font-size: 12.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
  .status.late { color: var(--late); } .status.soon { color: var(--soon); } .status.later { color: var(--muted); }
  .item.late .stamp b { color: var(--late); }
  .kicker { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 700; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 600; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 8px 8px 0; border-bottom: 1px solid var(--line); }
  td { padding: 11px 8px 11px 0; border-bottom: 1px solid var(--line); }
  td.n { font: 400 20px var(--serif); width: 70px; }
  td .late { color: var(--late); } td .ok { color: var(--ok); }
  td.nm { font-weight: 600; }

  .aside { border-left: 1px solid var(--line); padding-left: 40px; }
  .brief { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .brief h3 { font: 600 17px/1.3 var(--serif); margin: 4px 0 4px; }
  .brief p { margin: 0; font-size: 13px; color: var(--muted); }
  .quote { background: var(--accent-soft); padding: 20px 22px; margin: 6px 0 30px; border-left: 3px solid var(--accent); }
  .quote h3 { font: 700 18px var(--serif); margin: 0 0 8px; }
  .quote ul { margin: 0; padding-left: 18px; } .quote li { margin: 6px 0; }
  .foot { margin-top: 30px; border-top: 3px double var(--rule); padding-top: 10px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 1200px) { .lede, .cols { grid-template-columns: 1fr; gap: 28px; } .aside { border: 0; padding: 0; } .lede h1 { font-size: 40px; } }
  @media (max-width: 760px) { .wrap { padding: 0 16px 40px; } .mast { grid-template-columns: 1fr; text-align: center; gap: 8px; } .mast .r, .mast .l { justify-self: center; } .item { grid-template-columns: 70px 1fr; } .item .status { grid-column: 2; } }
</style>
</head>
<body>
<div id="pv"></div>
<script>
window.renderDesign = function (root, D) {
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  var mast = h('header', { class: 'mast' },
    h('div', { class: 'l', text: D.todayLong }),
    h('div', { class: 'c' }, h('b', { text: 'The Competency Hub' }), h('small', { text: 'Environmental Safety Group' })),
    h('div', { class: 'r' }, h('span', { class: 'env', text: 'Test data' }), h('span', null, h('b', { text: D.person.full }), ', ' + D.person.role)));
  var menu = h('nav', { class: 'menu', 'aria-label': 'Main' },
    ['Today', 'My actions', 'Areas', 'Noticeboard', 'Meetings'].concat(D.isMgmt ? ['Management'] : []).map(function (x, i) {
      return h('a', { href: '#', 'aria-current': i === 0 ? 'page' : null, text: x });
    }));

  var nextM = D.meetings[0];
  var leadText = D.isMgmt
    ? [ 'Across the group there are ', h('strong', { text: plural(D.group.late, 'late action', 'late actions') }), ' and ' + D.group.soon + ' due in the next week. ', 'Green Stream has not met since 2 September.' ]
    : [ D.late.length ? h('strong', { text: plural(D.late.length, 'action is', 'actions are') + ' late' }) : 'Nothing of yours is late', D.late.length ? ' and ' : ', and ', plural(D.soon.length, 'is', 'are') .replace(/^\d+ /, D.soon.length + ' ') + ' due this week. ', nextM ? 'Your next meeting is ' + nextM.area.name + ' on ' + nextM.when + '.' : '' ];
  if (!D.isMgmt) leadText[2] = D.soon.length + (D.soon.length === 1 ? ' is' : ' are') + ' due this week. ';

  var lede = h('section', { class: 'lede' },
    h('div', null, h('h1', { text: D.greeting + '.' }), h('p', null, leadText)),
    h('div', { class: 'cta' },
      h('div', { class: 'figs' },
        h('div', { class: 'fig' }, h('b', { text: String(D.isMgmt ? D.group.open : D.mine.length) }), h('span', { text: D.isMgmt ? 'Open in the group' : 'Your open actions' })),
        h('div', { class: 'fig' }, h('b', { style: 'color:var(--late)', text: String(D.isMgmt ? D.group.late : D.late.length) }), h('span', { text: 'Late' })),
        h('div', { class: 'fig' }, h('b', { text: String(D.isMgmt ? D.group.soon : D.soon.length) }), h('span', { text: 'This week' }))),
      h('div', { style: 'display:flex;gap:12px' }, h('button', { class: 'btn solid', type: 'button', text: 'Raise an action' }), h('button', { class: 'btn', type: 'button', text: 'Post a notice' }))));

  function stamp(a) {
    if (a.off < 0) return h('div', { class: 'stamp' }, h('b', { text: String(-a.off) }), h('span', { text: -a.off === 1 ? 'day late' : 'days late' }));
    var dt = a.date;
    return h('div', { class: 'stamp' }, h('b', { text: String(dt.getUTCDate()) }), h('span', { text: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getUTCMonth()] }));
  }
  var actions = h('section', { class: 'sec' },
    h('div', { class: 'sec-h' }, h('span', { class: 'no', text: 'I.' }), h('h2', { text: D.isMgmt ? 'Your own actions' : 'What needs doing' }), h('a', { href: '#', text: 'All my actions →' })),
    D.mine.map(function (a) {
      return h('div', { class: 'item ' + a.band }, stamp(a),
        h('div', null, h('div', { class: 'kicker', text: a.area.name }), h('div', { class: 't', text: a.title }),
          h('div', { class: 'm', text: a.ref + (a.waiting ? ' · Waiting on: ' + a.waiting : '') + (a.moved ? ' · Deadline moved ' + (a.moved === 1 ? 'once' : a.moved + ' times') : '') })),
        h('div', { class: 'status ' + a.band, text: a.due }));
    }));

  var areas = h('section', { class: 'sec' },
    h('div', { class: 'sec-h' }, h('span', { class: 'no', text: 'II.' }), h('h2', { text: D.isMgmt ? 'The ten areas' : 'Your areas' }), h('a', { href: '#', text: 'Open an area →' })),
    h('table', null, h('thead', null, h('tr', null, h('th', { text: 'Area' }), h('th', { text: 'Open' }), h('th', { text: 'Late' }), h('th', { text: 'Next meeting' }))),
      h('tbody', null, D.areas.map(function (a) {
        return h('tr', null, h('td', { class: 'nm', text: a.name }), h('td', { class: 'n', text: String(a.open) }),
          h('td', null, h('span', { class: a.late ? 'late' : 'ok', text: a.late ? a.late + ' late' : 'None' })),
          h('td', { text: a.next ? D.helpers.wdShort(a.next) : 'Not booked – last met ' + a.lastText.replace('Last met ', '') }));
      }))));

  var aside = h('aside', { class: 'aside' },
    D.manage.length ? h('div', { class: 'quote' }, h('h3', { text: D.isMgmt ? 'Needs your attention' : 'For you to manage' }), h('ul', null, D.manage.map(function (m) { return h('li', { text: m.text }); }))) : null,
    h('div', { class: 'sec-h' }, h('span', { class: 'no', text: 'III.' }), h('h2', { text: 'Noticeboard' })),
    D.notices.slice(0, 4).map(function (n) {
      return h('article', { class: 'brief' }, h('div', { class: 'kicker', text: (n.important ? 'Important · ' : '') + n.area.name }), h('h3', { text: n.title }), h('p', { text: n.by + ' · ' + n.when }));
    }),
    h('div', { class: 'sec-h', style: 'margin-top:30px' }, h('span', { class: 'no', text: 'IV.' }), h('h2', { text: 'Diary' })),
    D.meetings.slice(0, 3).map(function (m) { return h('div', { class: 'brief' }, h('div', { class: 'kicker', text: m.when }), h('h3', { text: m.area.name + ' monthly meeting' }), h('p', { text: m.time + ', ' + m.place })); }),
    D.dates.slice(0, 2).map(function (x) { return h('div', { class: 'brief' }, h('div', { class: 'kicker', text: x.when }), h('h3', { text: x.title }), h('p', { text: x.area.name })); }));

  var wrap = h('div', { class: 'wrap' }, mast, menu, lede, h('div', { class: 'cols' }, h('div', null, actions, areas), aside),
    h('footer', { class: 'foot' }, h('span', { text: 'ESG Competency Hub · Dungeness B' }), h('span', { text: 'Version 0.6.0 · Send feedback' })));
  root.appendChild(wrap);
};
</script>
<!--@SWITCH-->
</body>
</html>
