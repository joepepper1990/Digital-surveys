    var k = D.isMgmt
      ? [['Open actions', D.group.open, 'Across all areas', '#0f7c8c'], ['Late', D.group.late, 'In ' + D.allAreas.filter(function (a) { return a.late; }).length + ' areas', '#b42318'], ['Due in the next 7 days', D.group.soon, 'Across all areas', '#c27c0e'], ['Completed in 30 days', D.group.done30, 'Up from 17 the month before', '#1a7f4b']]
      : [['Your open actions', D.mine.length, D.areas.length + ' areas', '#0f7c8c'], ['Late', D.late.length, D.late.length ? 'Needs doing first' : 'Nothing late – well done', '#b42318'], ['Due in the next 7 days', D.soon.length, 'Including today', '#c27c0e'], ['Next meeting', D.meetings[0] ? D.meetings[0].when.split(' ').slice(0, 3).join(' ') : '–', D.meetings[0] ? D.meetings[0].area.name : 'None booked', '#1f5fae']];
    var kpis = h('div', { class: 'kpis' }, k.map(function (x) { return h('div', { class: 'kpi', style: '--c:' + x[3] }, h('span', { class: 'lbl', text: x[0] }), h('span', { class: 'num', text: String(x[1]) }), h('span', { class: 'sub', text: x[2] })); }));

    function actionsTable(list, title, meta) {
      return h('section', { class: 'panel' },
        h('header', null, h('h2', { text: title }), h('span', { class: 'meta', text: meta }), h('a', { href: '#', text: 'See all actions' })),
        list.length ? h('table', null,
          h('thead', null, h('tr', null, h('th', { text: 'Action' }), h('th', { text: 'Area' }), h('th', { text: 'Deadline' }))),
          h('tbody', null, list.map(function (a) {
            return h('tr', { tabindex: '0', class: 'row' },
              h('td', null, h('div', { class: 'ttl', text: a.title }), h('div', { class: 'ref', text: a.ref + (a.waiting ? ' · Waiting on: ' + a.waiting : '') + (a.moved ? ' · Deadline moved ' + (a.moved === 1 ? 'once' : a.moved + ' times') : '') })),
              h('td', null, h('span', { class: 'areatag' }, h('i'), a.area.name)),
              h('td', null, h('span', { class: 'chip ' + a.band, text: a.due })));
          }))) : h('div', { class: 'empty', text: 'You have no open actions.' }));
    }

    function areasPanel() {
      return h('section', { class: 'panel' },
        h('header', null, h('h2', { text: D.isMgmt ? 'Areas at a glance' : 'Your areas' }), h('span', { class: 'meta', text: 'Open · late' })),
        h('ul', { class: 'alist' }, D.areas.map(function (a) {
          var max = 22;
          return h('li', null, h('span', { class: 'nm', text: a.name }),
            h('span', { class: 'st' }, a.open + ' open · ', h('span', { style: 'color:' + (a.late ? 'var(--late)' : 'var(--ok)') + ';font-weight:600', text: a.late ? a.late + ' late' : 'none late' })),
            h('div', { class: 'bar', 'aria-hidden': 'true' },
              h('span', { style: 'width:' + (a.late / max * 100) + '%;background:#d9473a' }),
              h('span', { style: 'width:' + (a.soon / max * 100) + '%;background:#e3a93b' }),
              h('span', { style: 'width:' + ((a.open - a.late - a.soon) / max * 100) + '%;background:#7fbcc5' })));
        })));
    }

    function managePanel() {
      return h('section', { class: 'panel' },
        h('header', null, h('h2', { text: D.isMgmt ? 'Needs your attention' : 'For you to manage' }), h('span', { class: 'meta', text: D.manage.length + ' items' })),
        h('ul', { class: 'todo' }, D.manage.map(function (m) {
          return h('li', null, h('span', { class: 'tag' + (m.kind === 'Late' ? ' late' : ''), text: m.kind }), h('div', null, h('div', { text: m.text }), m.area ? h('div', { class: 'note', text: (D.allAreas.filter(function (x) { return x.key === m.area; })[0] || {}).name }) : null));
        })));
    }

    function meetingsPanel() {
      return h('section', { class: 'panel' },
        h('header', null, h('h2', { text: 'Coming meetings' }), h('a', { href: '#', text: 'All meetings' })),
        h('ul', { class: 'todo' }, D.meetings.map(function (m) {
          return h('li', null, h('span', { class: 'tag', style: 'background:#eaf1fb;color:#1f5fae', text: m.when.split(' ').slice(0, 3).join(' ') }), h('div', null, h('div', { style: 'font-weight:600', text: m.area.name + ' monthly meeting' }), h('div', { class: 'note', text: m.time + ' · ' + m.place + ' · ' + m.items + ' agenda items' })));
        })));
    }

    function noticesPanel() {
      return h('section', { class: 'panel' },
        h('header', null, h('h2', { text: 'Latest notices' }), h('a', { href: '#', text: 'All notices' })),
        h('ul', { class: 'todo' }, D.notices.slice(0, 4).map(function (n) {
          return h('li', null, h('span', { class: 'tag', style: n.important ? 'background:#fff1e7;color:#b5470b' : 'background:#eef2f6;color:#4a5868', text: n.important ? 'Important' : n.area.key }), h('div', null, h('div', { style: 'font-weight:600', text: n.title }), h('div', { class: 'note', text: n.area.name + ' · ' + n.by + ' · ' + n.when })));
        })));
    }

    var left = h('div', { style: 'display:flex;flex-direction:column;gap:20px' },
      D.canManage ? managePanel() : null,
      actionsTable(D.mine, D.isMgmt ? 'Your own actions' : 'Your actions', D.late.length ? D.late.length + ' late, ' + D.soon.length + ' due this week' : D.soon.length + ' due this week'),
      h('div', { class: 'two' }, meetingsPanel(), noticesPanel()));
    var content = h('div', { class: 'content' }, head, kpis, h('div', { class: 'grid' }, left, areasPanel()));
    root.appendChild(rail);
    root.appendChild(h('div', { class: 'main' }, top, content));
  };
})();
</script>
<script>
// Preview controls: design name, previous/next design and "Preview as". Stands in for SharePoint's own bar.
(function () {
  'use strict';
  var D = window.DESIGN;
  var ROLES = [['tech', 'Technician'], ['eng', 'Engineer'], ['mgmt', 'Team Leader']];
  var params = new URLSearchParams(location.search);
  var role = params.get('role') || 'tech';
  if (!ROLES.some(function (r) { return r[0] === role; })) role = 'tech';

  function bar() {
    var b = h('div', { class: 'pv-switch', role: 'navigation', 'aria-label': 'Preview controls' },
      h('span', { class: 'pv-name' }, h('b', { text: 'Design ' + D.n + ' of 5' }), ' · ' + D.name),
      D.n > 1 ? h('a', { href: D.files[D.n - 2] + '?role=' + role, text: '‹ Previous' }) : null,
      D.n < 5 ? h('a', { href: D.files[D.n] + '?role=' + role, text: 'Next ›' }) : null,
      h('span', { class: 'pv-sep', text: 'Preview as' }),
      ROLES.map(function (r) {
        return h('button', { type: 'button', 'aria-pressed': String(r[0] === role), text: r[1], onclick: function () { role = r[0]; history.replaceState(null, '', '?role=' + role); draw(); } });
      }));
    return b;
  }
  function draw() {
    var root = document.getElementById('pv');
    root.textContent = '';
    root.appendChild(bar());
    var app = h('div', { class: 'pv-app' });
    root.appendChild(app);
    window.renderDesign(app, window.CHDATA(role));
  }
  document.addEventListener('DOMContentLoaded', draw);
})();
</script>
</body>
