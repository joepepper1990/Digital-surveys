<script>
// Sample data shared by the five design previews. Nothing here connects to SharePoint.
(function () {
  'use strict';
  var TODAY = new Date(Date.UTC(2026, 9, 23)); // Friday 23 October 2026
  var DAY = 86400000;
  function d(offset) { return new Date(TODAY.getTime() + offset * DAY); }
  var WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function short(dt) { return dt.getUTCDate() + ' ' + MO[dt.getUTCMonth()]; }
  function wdShort(dt) { return WD[dt.getUTCDay()].slice(0, 3) + ' ' + short(dt); }

  var AREAS = [
    { key: 'FLK', name: 'Flask', open: 12, late: 1, soon: 2, moved: 2, next: 19, last: -9, flagged: 3, issues: 1 },
    { key: 'INS', name: 'Instruments', open: 8, late: 0, soon: 1, moved: 1, next: 20, last: -8, flagged: 1, issues: 0 },
    { key: 'GRS', name: 'Green Stream', open: 18, late: 3, soon: 4, moved: 3, next: null, last: -51, flagged: 0, issues: 2 },
    { key: 'RPE', name: 'RPE', open: 6, late: 0, soon: 0, moved: 0, next: 26, last: -3, flagged: 0, issues: 0 },
    { key: 'BA', name: 'BA', open: 4, late: 0, soon: 1, moved: 0, next: 21, last: -14, flagged: 1, issues: 0 },
    { key: 'DOS', name: 'Dosimetry', open: 7, late: 0, soon: 2, moved: 1, next: 27, last: -2, flagged: 2, issues: 0 },
    { key: 'RP', name: 'Radiological Protection', open: 21, late: 2, soon: 3, moved: 2, next: 4, last: -10, flagged: 1, issues: 1 },
    { key: 'DSL', name: 'DSL', open: 5, late: 0, soon: 0, moved: 0, next: 28, last: -7, flagged: 0, issues: 0 },
    { key: 'ALS', name: 'Active Lab & Sampling', open: 9, late: 0, soon: 1, moved: 1, next: 32, last: -1, flagged: 0, issues: 1 },
    { key: 'RW', name: 'Radwaste', open: 6, late: 3, soon: 1, moved: 1, next: 20, last: -15, flagged: 3, issues: 0 }
  ];
  var BY = {};
  AREAS.forEach(function (a) { BY[a.key] = a; });

  var PEOPLE = {
    tech: { first: 'Rachel', full: 'Rachel Boulden', initials: 'RB', role: 'Technician', areas: ['FLK', 'INS', 'GRS', 'DOS', 'RP', 'ALS'] },
    eng: { first: 'Kelly', full: 'Kelly Bates', initials: 'KB', role: 'Engineer', areas: ['FLK', 'GRS', 'RP', 'DSL', 'RW'] },
    mgmt: { first: 'Joseph', full: 'Joseph Pepper', initials: 'JP', role: 'Team Leader', areas: AREAS.map(function (a) { return a.key; }) }
  };

  // [reference, title, area, due offset in days, extra]
  var MINE = {
    tech: [
      ['ACT-00042', 'Replace FH40 probe', 'FLK', -2, { moved: 1 }],
      ['ACT-00057', 'Update dosimetry issue log', 'DOS', 0, {}],
      ['ACT-00061', 'Review RP survey frequencies', 'RP', 2, {}],
      ['ACT-00064', 'Calibrate sampling line flow meter', 'ALS', 5, { waiting: 'Spare parts on order' }],
      ['ACT-00070', 'Green Stream handover notes', 'GRS', 17, {}],
      ['ACT-00071', 'Instrument loan register tidy-up', 'INS', 28, {}]
    ],
    eng: [
      ['ACT-00038', 'Approve revised drum store labels', 'RW', -4, { moved: 2 }],
      ['ACT-00055', 'Review Green Stream sample results', 'GRS', 1, {}],
      ['ACT-00066', 'Update DSL operating instruction', 'DSL', 6, {}],
      ['ACT-00073', 'Flask procedure FLK-03 rewrite', 'FLK', 24, {}]
    ],
    mgmt: [
      ['ACT-00049', 'Agree Q4 training priorities', 'RP', 3, {}],
      ['ACT-00068', 'Sign off Radwaste audit response', 'RW', 35, {}]
    ]
  };

  var MANAGE = {
    eng: [
      { kind: 'Close-out check', text: 'Leak-test kit replacement is done – check and close it', area: 'FLK', ref: 'ACT-00031' },
      { kind: 'Late', text: 'Green Stream sampling backlog is 9 days late (Luke Cain)', area: 'GRS', ref: 'ACT-00022' },
      { kind: 'Late', text: 'Drum inventory reconciliation is 2 days late (Adam Washford)', area: 'RW', ref: 'ACT-00040' },
      { kind: 'For the meeting', text: '3 items flagged for the Radwaste meeting', area: 'RW' },
      { kind: 'Meeting', text: 'No Green Stream meeting since 2 September', area: 'GRS' }
    ],
    mgmt: [
      { kind: 'Late', text: '9 actions are late across 4 areas', area: null },
      { kind: 'Meeting', text: 'Green Stream has not met since 2 September', area: 'GRS' },
      { kind: 'Deadlines', text: '6 actions have had their deadline moved twice or more', area: null },
      { kind: 'Issue', text: '2 degradations are unresolved in Green Stream', area: 'GRS' },
      { kind: 'Late', text: 'Radwaste has 3 late actions out of 6 open', area: 'RW' }
    ]
  };

  var NOTICES = [
    { area: 'RP', title: 'New contamination survey forms from Monday', by: 'Andrea Medlicott', age: 0, important: true },
    { area: 'FLK', title: 'FH40 spares now in the stores cage', by: 'Nick Pearce', age: 1, important: false },
    { area: 'GRS', title: 'Sampling point SP-4 out of use until further notice', by: 'Kai Todd', age: 2, important: true },
    { area: 'DOS', title: 'Dosimeter issue times change in November', by: 'Doti Cange-Ainsworth', age: 3, important: false },
    { area: 'ALS', title: 'Fume cupboard 2 back in service', by: 'Trevor Baldwin', age: 4, important: false }
  ];

  var DATES = [
    { area: 'RP', title: 'Instrument calibration day', day: 6 },
    { area: 'GRS', title: 'Station outage planning review', day: 11 },
    { area: 'FLK', title: 'External audit visit', day: 14 }
  ];

  function dueText(off) {
    if (off < -1) return (-off) + ' days late';
    if (off === -1) return '1 day late';
    if (off === 0) return 'Due today';
    if (off === 1) return 'Due tomorrow';
    if (off < 7) return 'Due ' + WD[d(off).getUTCDay()];
    return 'Due ' + short(d(off));
  }
  function band(off) { return off < 0 ? 'late' : off < 7 ? 'soon' : 'later'; }

  window.CHDATA = function (role) {
    var p = PEOPLE[role];
    var mine = MINE[role].map(function (r) {
      return { ref: r[0], title: r[1], area: BY[r[2]], off: r[3], due: dueText(r[3]), band: band(r[3]), date: d(r[3]), moved: r[4].moved || 0, waiting: r[4].waiting || '' };
    });
    var areas = p.areas.map(function (k) {
      var a = BY[k];
      return {
        key: a.key, name: a.name, open: a.open, late: a.late, soon: a.soon, moved: a.moved, flagged: a.flagged, issues: a.issues,
        next: a.next === null ? null : d(a.next), nextText: a.next === null ? 'No meeting booked' : 'Meeting ' + wdShort(d(a.next)),
        lastText: 'Last met ' + short(d(a.last)), stale: a.last < -35, nextIn: a.next
      };
    });
    var meetings = areas.filter(function (a) { return a.next; }).sort(function (x, y) { return x.next - y.next; }).slice(0, 4)
      .map(function (a) { return { area: a, date: a.next, when: wdShort(a.next), time: '10:00', place: 'Admin building, room 2', items: a.flagged + a.late + 4 }; });
    var group = AREAS.reduce(function (t, a) { t.open += a.open; t.late += a.late; t.soon += a.soon; t.moved += a.moved; t.issues += a.issues; return t; }, { open: 0, late: 0, soon: 0, moved: 0, issues: 0, done30: 23 });
    var hour = 9;
    return {
      role: role, isMgmt: role === 'mgmt', canManage: role !== 'tech', person: p,
      greeting: (hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening') + ', ' + p.first,
      todayLong: 'Friday 23 October 2026',
      mine: mine,
      late: mine.filter(function (a) { return a.band === 'late'; }),
      soon: mine.filter(function (a) { return a.band === 'soon'; }),
      later: mine.filter(function (a) { return a.band === 'later'; }),
      areas: areas, allAreas: AREAS,
      manage: MANAGE[role] || [],
      meetings: meetings,
      notices: NOTICES.filter(function (n) { return p.areas.indexOf(n.area) >= 0; }).map(function (n) {
        return { area: BY[n.area], title: n.title, by: n.by, when: n.age === 0 ? 'Today' : n.age === 1 ? 'Yesterday' : n.age + ' days ago', important: n.important };
      }),
      dates: DATES.filter(function (x) { return p.areas.indexOf(x.area) >= 0; }).map(function (x) { return { area: BY[x.area], title: x.title, when: wdShort(d(x.day)), date: d(x.day) }; }),
      group: group,
      week: [0, 1, 2, 3, 4, 5, 6].map(function (i) {
        var dt = d(i);
        return {
          date: dt, label: WD[dt.getUTCDay()].slice(0, 3), num: dt.getUTCDate(), today: i === 0, weekend: dt.getUTCDay() === 0 || dt.getUTCDay() === 6,
          actions: mine.filter(function (a) { return a.off === i || (i === 0 && a.off < 0); }),
          meetings: meetings.filter(function (m) { return Math.round((m.date - TODAY) / DAY) === i; })
        };
      }),
      helpers: { short: short, wdShort: wdShort }
    };
  };

  // Tiny element helper: h('div', {class: 'x', text: 'y'}, child, ...)
  window.h = function (tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'text') el.textContent = v;
      else if (k === 'class') el.className = v;
      else if (k === 'style') el.setAttribute('style', v);
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined || c === false) continue;
      if (Array.isArray(c)) c.forEach(function (x) { if (x) el.appendChild(typeof x === 'string' ? document.createTextNode(x) : x); });
      else el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return el;
  };
})();
</script>

<style>
  :root {
    --bg: #f5f4fb; --card: #fff; --ink: #1d1a33; --muted: #625e7c; --line: #e6e3f2;
    --brand: #4b3fb5; --brand-2: #6d5fe0; --brand-soft: #ecebfb; --well: #efedf8;
    --late: #c2273a; --late-bg: #fdecef; --soon: #9a5b00; --soon-bg: #fff3dc; --later: #4b5a6d; --later-bg: #eef1f5;
    --ok: #1e7d55; --ok-bg: #e4f4ec; --mtg: #0d6e8c; --mtg-bg: #e3f4f8;
    --gap: 14px; --r: 14px; --head: 44px; --cardh: 56px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 "Segoe UI", system-ui, Arial, sans-serif; }
  button { font: inherit; cursor: pointer; color: inherit; }
  a { color: var(--brand); }
  :focus-visible { outline: 3px solid var(--brand-2); outline-offset: 2px; }

  /* The page fills the window exactly and never scrolls. */
  #pv { height: 100vh; display: flex; flex-direction: column; }
  .pv-app { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .bar { flex: none; display: flex; align-items: center; gap: 16px; height: 56px; padding: 0 24px; background: #fff; border-bottom: 1px solid var(--line); }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15.5px; white-space: nowrap; }
  .logo .dot { width: 26px; height: 26px; border-radius: 50%; background: conic-gradient(from 200deg, var(--brand), #9b8cff, var(--brand)); }
  .env { font-size: 11px; font-weight: 700; color: var(--soon); background: var(--soon-bg); border-radius: 999px; padding: 1px 9px; }
  .pills { display: flex; gap: 2px; background: var(--well); border-radius: 999px; padding: 3px; margin-left: 10px; }
  .pills a { text-decoration: none; color: var(--muted); padding: 5px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; white-space: nowrap; }
  .pills a[aria-current] { background: var(--brand); color: #fff; }
  .bar .btns { margin-left: auto; display: flex; gap: 8px; }
  .btn { border-radius: 999px; padding: 7px 16px; font-weight: 700; border: 1.5px solid var(--line); background: #fff; white-space: nowrap; }
  .btn.main { background: var(--brand); border-color: var(--brand); color: #fff; }
  .me { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .me b { color: var(--ink); display: block; font-size: 13px; line-height: 1.2; }
  .av { width: 32px; height: 32px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 700; font-size: 12px; }

  .hello { flex: none; display: flex; align-items: baseline; gap: 14px; padding: 14px 24px 10px; flex-wrap: wrap; }
  .hello h1 { margin: 0; font-size: 22px; letter-spacing: -.3px; }
  .hello p { margin: 0; color: var(--muted); font-size: 14.5px; }
  .hello p b { color: var(--late); }

  .stack { flex: 1; min-height: 0; display: grid; gap: var(--gap); padding: 0 24px 18px; }
  .row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); min-height: 0; align-items: stretch; }

  /* One panel component for every section. */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel.closed { align-self: start; }
  .ph { flex: none; height: var(--head); display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--line); }
  .panel.closed .ph { border-bottom: 0; }
  .ph button.tg { all: unset; display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; height: 100%; cursor: pointer; border-radius: 8px; }
  .ph button.tg:focus-visible { outline: 3px solid var(--brand-2); outline-offset: -3px; }
  .ph h2 { margin: 0; font-size: 14.5px; font-weight: 700; white-space: nowrap; }
  .ph .sum { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ph .chev { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); flex: none; transition: transform .15s; }
  .panel.closed .chev { transform: rotate(-90deg); }
  .ph a.all { font-size: 12.5px; font-weight: 700; text-decoration: none; white-space: nowrap; padding: 0 8px; }
  .pb { flex: 1; min-height: 0; padding: 12px 14px 12px; display: flex; flex-direction: column; overflow: hidden; }
  .panel.closed .pb { display: none; }

  /* Lists that only show what fits, then "+ n more". */
  .fitlist { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
  .more { flex: none; margin-top: 6px; font-size: 12.5px; font-weight: 700; text-decoration: none; display: none; }
  .more.on { display: block; }

  /* Uniform card */
  .card { flex: none; height: var(--cardh); background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; display: flex; flex-direction: column; justify-content: center; gap: 3px; cursor: pointer; }
  .card:hover { border-color: #cfcaf1; }
  .card .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .m { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; color: var(--muted); }
  .card .m .x { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { flex: none; font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 0 7px; line-height: 19px; white-space: nowrap; }
  .chip.area { background: var(--brand-soft); color: var(--brand); font-weight: 600; max-width: 55%; overflow: hidden; text-overflow: ellipsis; }
  .chip.late { background: var(--late-bg); color: var(--late); } .chip.soon { background: var(--soon-bg); color: var(--soon); } .chip.later { background: var(--later-bg); color: var(--later); }
  .chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.mtg { background: var(--mtg-bg); color: var(--mtg); } .chip.kind { background: var(--later-bg); color: var(--later); }
  .chip.r { margin-left: auto; }

  /* This week */
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; height: 100%; }
  .day { border: 1px solid var(--line); border-radius: 10px; padding: 8px 9px; display: flex; flex-direction: column; gap: 5px; min-width: 0; background: #fff; }
  .day.today { border: 2px solid var(--brand); padding: 7px 8px; }
  .day.weekend { background: #faf9fd; }
  .dh { display: flex; align-items: baseline; gap: 6px; }
  .dh b { font-size: 18px; line-height: 1; } .dh span { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .dh em { margin-left: auto; font-style: normal; font-size: 10.5px; font-weight: 700; color: #fff; background: var(--brand); border-radius: 999px; padding: 0 7px; }
  .ev { border-radius: 7px; padding: 3px 7px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.late { background: var(--late-bg); color: var(--late); } .ev.soon { background: var(--soon-bg); color: #6b4000; } .ev.mtg { background: var(--mtg-bg); color: var(--mtg); }
  .day .none { color: #9b97b6; font-size: 12px; margin-top: auto; }
  .day .plus { font-size: 11.5px; color: var(--muted); font-weight: 600; }

  /* Your actions: equal columns */
  .lanes { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 12px; height: 100%; min-height: 0; }
  .lane { background: var(--well); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; min-height: 0; }
  .lane h3 { flex: none; margin: 0 2px 8px; font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .lane h3 i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .lane h3 span { margin-left: auto; background: #fff; color: var(--muted); border-radius: 999px; padding: 0 8px; font-size: 11.5px; }
  .empty { flex: none; border: 1.5px dashed #d4d0ea; border-radius: 10px; padding: 12px; color: var(--muted); text-align: center; font-size: 12.5px; background: rgba(255,255,255,.6); }

  /* Compact rows for areas, notices and meetings */
  .rows { gap: 0; }
  .rw { flex: none; height: 46px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); min-width: 0; }
  .rw:last-child { border-bottom: 0; }
  .rw .tx { min-width: 0; flex: 1; }
  .rw .tx b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rw .tx small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rw .dot { width: 8px; height: 8px; border-radius: 50%; background: #c9c5e0; flex: none; } .rw .dot.on { background: #e8642c; }
  .cal { width: 38px; flex: none; border-radius: 8px; overflow: hidden; text-align: center; border: 1px solid var(--line); line-height: 1.1; }
  .cal small { display: block; background: var(--mtg); color: #fff; font-size: 9.5px; font-weight: 700; text-transform: uppercase; padding: 1px 0; }
  .cal b { display: block; font-size: 14px; padding: 2px 0; }
  .areas2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; align-content: start; }
  .areas2 .rw { border-bottom: 1px solid var(--line); }

  /* Small or narrow windows: fall back to ordinary scrolling */
  @media (max-width: 900px), (max-height: 560px) {
    #pv { height: auto; } .pv-app { overflow: visible; }
    .stack { display: flex; flex-direction: column; }
    .row3 { grid-template-columns: 1fr; }
    .week { grid-template-columns: repeat(2, 1fr); } .lanes { grid-template-columns: 1fr; }
    .fitlist { overflow: visible; } .pills, .me div { display: none; } .bar { flex-wrap: wrap; height: auto; padding: 8px 16px; }
    .stack, .hello { padding-left: 16px; padding-right: 16px; }
  }
</style>

<script>
(function () {
  var KEY = 'ch-home-collapsed';
  function loadState() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
  function saveState(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* not available */ } }
  var state = loadState() || { areas: innerHeight < 900, notices: innerHeight < 900, meetings: innerHeight < 900 };
  var fitters = [];

  function chevron() { var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', '18'); s.setAttribute('height', '18'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2.2'); s.setAttribute('aria-hidden', 'true'); var p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', 'm6 9 6 6 6-6'); s.appendChild(p); return s; }

  // A panel: header button (title, summary, chevron), optional "See all" link, and a body.
  function panel(id, title, summary, body, link, onToggle) {
    var bodyId = 'pb-' + id;
    var p = h('section', { class: 'panel' + (state[id] ? ' closed' : ''), 'data-id': id, 'aria-label': title });
    var tg = h('button', { class: 'tg', type: 'button', 'aria-expanded': String(!state[id]), 'aria-controls': bodyId },
      h('h2', { text: title }), h('span', { class: 'sum', text: summary }), h('span', { class: 'chev' }, chevron()));
    tg.addEventListener('click', function () {
      state[id] = !state[id]; saveState(state);
      p.classList.toggle('closed', state[id]); tg.setAttribute('aria-expanded', String(!state[id]));
      onToggle(); refit();
    });
    p.appendChild(h('div', { class: 'ph' }, tg, link ? h('a', { class: 'all', href: '#', text: link }) : null));
    p.appendChild(h('div', { class: 'pb', id: bodyId }, body));
    return p;
  }

  // Show only the items that fit; the rest are counted in "+ n more".
  function fitList(items, moreText, cls) {
    var list = h('div', { class: 'fitlist ' + (cls || '') }, items);
    var more = h('a', { class: 'more', href: '#' });
    var fit = function () {
      items.forEach(function (x) { x.hidden = false; });
      more.classList.remove('on');
      if (getComputedStyle(list).overflow === 'visible') return;
      var shown = items.length;
      function over() { return list.scrollHeight > list.clientHeight + 1 || (list.classList.contains('areas2') && list.scrollHeight > list.clientHeight + 1); }
      if (!over()) return;
      more.classList.add('on');
      while (shown > 0 && over()) { shown--; items[shown].hidden = true; }
      if (shown < items.length) more.textContent = shown ? '+ ' + (items.length - shown) + ' more – ' + moreText : items.length + ' items – ' + moreText;
      else more.classList.remove('on');
    };
    fitters.push(fit);
    // Re-fit whenever the space for this list changes (panels opening or closing, window resizing).
    if (window.ResizeObserver) { var last = -1; new ResizeObserver(function () { if (list.clientHeight !== last) { last = list.clientHeight; fit(); } }).observe(list); }
    return [list, more];
  }
  function refit() { requestAnimationFrame(function () { fitters.forEach(function (f) { f(); }); }); }
  window.addEventListener('resize', refit);

  window.renderDesign = function (root, D) {
    fitters = [];
    var bar = h('header', { class: 'bar' },
      h('div', { class: 'logo' }, h('span', { class: 'dot' }), 'Competency Hub'),
      h('span', { class: 'env', text: 'TEST' }),
      h('nav', { class: 'pills', 'aria-label': 'Main' }, ['My week', 'Actions', 'Areas', 'Notices', 'Meetings'].concat(D.isMgmt ? ['Management'] : []).map(function (x, i) { return h('a', { href: '#', 'aria-current': i === 0 ? 'page' : null, text: x }); })),
      h('div', { class: 'btns' }, h('button', { class: 'btn', type: 'button', text: 'Post a notice' }), h('button', { class: 'btn main', type: 'button', text: '+ Raise an action' })),
      h('div', { class: 'me' }, h('div', null, h('b', { text: D.person.full }), D.person.role), h('div', { class: 'av', text: D.person.initials })));

    var lateN = D.isMgmt ? D.group.late : D.late.length;
    var hello = h('div', { class: 'hello' }, h('h1', { text: D.greeting }),
      h('p', null, lateN ? h('b', { text: lateN + ' late' + (D.isMgmt ? ' across the group' : '') }) : 'Nothing late',
        ' · ' + D.soon.length + ' due this week' + (D.meetings[0] ? ' · next meeting ' + D.meetings[0].area.name + ', ' + D.meetings[0].when : '')));

    // This week
    var dueCount = D.week.reduce(function (t, d) { return t + d.actions.length; }, 0);
    var mtgCount = D.week.reduce(function (t, d) { return t + d.meetings.length; }, 0);
    var week = h('div', { class: 'week' }, D.week.map(function (d) {
      var evs = d.actions.map(function (a) { return h('div', { class: 'ev ' + (a.off < 0 ? 'late' : 'soon'), title: a.title, text: a.title }); })
        .concat(d.meetings.map(function (m) { return h('div', { class: 'ev mtg', title: m.area.name + ' meeting', text: m.time + ' ' + m.area.name }); }));
      return h('div', { class: 'day' + (d.today ? ' today' : '') + (d.weekend ? ' weekend' : '') },
        h('div', { class: 'dh' }, h('b', { text: String(d.num) }), h('span', { text: d.label }), d.today ? h('em', { text: 'Today' }) : null),
        evs.slice(0, 2), evs.length > 2 ? h('div', { class: 'plus', text: '+ ' + (evs.length - 2) + ' more' }) : null,
        evs.length ? null : h('div', { class: 'none', text: d.weekend ? 'Weekend' : 'Nothing due' }));
    }));

    // Your actions
    function card(a) {
      return h('div', { class: 'card', tabindex: '0', title: a.title }, h('div', { class: 't', text: a.title }),
        h('div', { class: 'm' }, h('span', { class: 'chip area', text: a.area.name }),
          a.waiting ? h('span', { class: 'x', text: 'Waiting on: ' + a.waiting }) : a.moved ? h('span', { class: 'x', text: 'Moved ' + (a.moved === 1 ? 'once' : a.moved + '×') }) : null,
          h('span', { class: 'chip r ' + a.band, text: a.due })));
    }
    function lane(title, c, items, empty, moreText) {
      var f = items.length ? fitList(items, moreText) : [h('div', { class: 'empty', text: empty })];
      return h('div', { class: 'lane' }, h('h3', { style: '--c:' + c }, h('i'), title, h('span', { text: String(items.length) })), f);
    }
    var lanes = [];
    if (D.canManage) lanes.push(lane(D.isMgmt ? 'Needs your attention' : 'For you to manage', '#4b3fb5', D.manage.map(function (m) {
      return h('div', { class: 'card', tabindex: '0', title: m.text }, h('div', { class: 't', text: m.text }), h('div', { class: 'm' }, h('span', { class: 'chip kind', text: m.kind })));
    }), 'Nothing needs you right now.', 'see all'));
    lanes.push(lane('Late', '#c2273a', D.late.map(card), 'Nothing late. Nice work.', 'see all late'));
    lanes.push(lane('Due this week', '#d08a12', D.soon.map(card), 'Nothing due this week.', 'see all'));
    lanes.push(lane('Coming up', '#8a95a5', D.later.map(card), 'Nothing further ahead.', 'see all'));
    var lanesEl = h('div', { class: 'lanes', style: '--n:' + lanes.length }, lanes);

    // Bottom row
    var areaRows = D.areas.map(function (a) {
      return h('div', { class: 'rw' }, h('span', { class: 'tx' }, h('b', { text: a.name }), h('small', { text: a.stale ? 'No meeting since 2 Sep' : a.nextText })),
        h('span', { class: 'chip ' + (a.late ? 'late' : 'ok'), text: a.late ? a.late + ' late' : a.open + ' open' }));
    });
    var noticeRows = D.notices.map(function (n) {
      return h('div', { class: 'rw' }, h('span', { class: 'dot' + (n.important ? ' on' : ''), title: n.important ? 'Important' : '' }),
        h('span', { class: 'tx' }, h('b', { text: n.title }), h('small', { text: (n.important ? 'Important · ' : '') + n.area.name + ' · ' + n.when })));
    });
    var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var meetingRows = D.meetings.map(function (m) {
      return h('div', { class: 'rw' }, h('div', { class: 'cal' }, h('small', { text: M[m.date.getUTCMonth()] }), h('b', { text: String(m.date.getUTCDate()) })),
        h('span', { class: 'tx' }, h('b', { text: m.area.name }), h('small', { text: m.when + ' · ' + m.time + ' · ' + m.items + ' agenda items' })));
    });
    var lateAreas = D.areas.filter(function (a) { return a.late; }).length;
    var important = D.notices.filter(function (n) { return n.important; }).length;

    var stack = h('div', { class: 'stack' });
    function layout() {
      var bottomOpen = !(state.areas && state.notices && state.meetings);
      var rows = [state.week ? 'auto' : 'clamp(112px, 17vh, 150px)', state.actions ? 'auto' : 'minmax(0, 1.55fr)', bottomOpen ? 'minmax(0, 1fr)' : 'auto'];
      if (state.actions && bottomOpen) rows[2] = 'minmax(0, 1fr)';
      if (state.actions && !bottomOpen) rows.push('1fr');
      stack.style.gridTemplateRows = rows.join(' ');
    }
    stack.appendChild(panel('week', 'This week', dueCount + ' due · ' + mtgCount + ' meeting' + (mtgCount === 1 ? '' : 's'), week, 'Open calendar', layout));
    stack.appendChild(panel('actions', D.isMgmt ? 'Your work' : 'Your actions', D.late.length + ' late · ' + D.soon.length + ' this week · ' + D.later.length + ' later' + (D.canManage ? ' · ' + D.manage.length + ' to manage' : ''), lanesEl, 'All actions', layout));
    stack.appendChild(h('div', { class: 'row3' },
      panel('areas', D.isMgmt ? 'All areas' : 'Your areas', D.areas.length + ' areas · ' + (lateAreas ? lateAreas + ' with late actions' : 'none late'), fitList(areaRows, 'all areas', 'rows areas2'), 'Browse', layout),
      panel('notices', 'Notices', important ? important + ' important' : D.notices.length + ' recent', fitList(noticeRows, 'all notices', 'rows'), 'All', layout),
      panel('meetings', 'Meetings', D.meetings[0] ? 'Next ' + D.meetings[0].when : 'None booked', fitList(meetingRows, 'all meetings', 'rows'), 'All', layout)));
    layout();

    root.appendChild(bar); root.appendChild(hello); root.appendChild(stack);
    refit();
  };
})();
</script>
<script>
// Preview controls: design name, previous/next design and "Preview as". Stands in for SharePoint's own bar.
(function () {
  'use strict';
  var D = window.DESIGN;
  var ROLES = [['tech', 'Technician'], ['eng', 'Engineer'], ['mgmt', 'Team Leader']];
  var params = new URLSearchParams(location.search);
  var role = params.get('role') || 'tech';
  if (!ROLES.some(function (r) { return r[0] === role; })) role = 'tech';

  function bar() {
    var b = h('div', { class: 'pv-switch', role: 'navigation', 'aria-label': 'Preview controls' },
      h('span', { class: 'pv-name' }, h('b', { text: 'Design ' + D.n + ' of 5' }), ' · ' + D.name),
      D.n > 1 ? h('a', { href: D.files[D.n - 2] + '?role=' + role, text: '‹ Previous' }) : null,
      D.n < 5 ? h('a', { href: D.files[D.n] + '?role=' + role, text: 'Next ›' }) : null,
      h('span', { class: 'pv-sep', text: 'Preview as' }),
      ROLES.map(function (r) {
        return h('button', { type: 'button', 'aria-pressed': String(r[0] === role), text: r[1], onclick: function () { role = r[0]; history.replaceState(null, '', '?role=' + role); draw(); } });
      }));
    return b;
  }
  function draw() {
    var root = document.getElementById('pv');
    root.textContent = '';
    root.appendChild(bar());
    var app = h('div', { class: 'pv-app' });
    root.appendChild(app);
    window.renderDesign(app, window.CHDATA(role));
  }
  document.addEventListener('DOMContentLoaded', draw);
})();
</script>
</body>
