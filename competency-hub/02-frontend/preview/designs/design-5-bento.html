<style>
.pv-switch { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 10px; padding: 6px 14px; background: #1f1f1f; color: #eee; font: 12px/1.4 "Segoe UI", Arial, sans-serif; white-space: nowrap; overflow-x: auto; }
.pv-switch a { color: #fff; text-decoration: none; border: 1px solid #555; border-radius: 4px; padding: 2px 8px; }
.pv-switch .pv-sep { margin-left: auto; opacity: .7; }
.pv-switch button { font: inherit; color: #fff; background: #333; border: 1px solid #555; border-radius: 4px; padding: 2px 9px; cursor: pointer; }
.pv-switch button[aria-pressed="true"] { background: #fff; color: #111; border-color: #fff; }

<script>
// Sample data shared by the five design previews. Nothing here connects to SharePoint.
(function () {
  'use strict';
  var TODAY = new Date(Date.UTC(2026, 9, 23)); // Friday 23 October 2026
  var DAY = 86400000;
  function d(offset) { return new Date(TODAY.getTime() + offset * DAY); }
  var WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function short(dt) { return dt.getUTCDate() + ' ' + MO[dt.getUTCMonth()]; }
  function wdShort(dt) { return WD[dt.getUTCDay()].slice(0, 3) + ' ' + short(dt); }

  var AREAS = [
    { key: 'FLK', name: 'Flask', open: 12, late: 1, soon: 2, moved: 2, next: 19, last: -9, flagged: 3, issues: 1 },
    { key: 'INS', name: 'Instruments', open: 8, late: 0, soon: 1, moved: 1, next: 20, last: -8, flagged: 1, issues: 0 },
    { key: 'GRS', name: 'Green Stream', open: 18, late: 3, soon: 4, moved: 3, next: null, last: -51, flagged: 0, issues: 2 },
    { key: 'RPE', name: 'RPE', open: 6, late: 0, soon: 0, moved: 0, next: 26, last: -3, flagged: 0, issues: 0 },
    { key: 'BA', name: 'BA', open: 4, late: 0, soon: 1, moved: 0, next: 21, last: -14, flagged: 1, issues: 0 },
    { key: 'DOS', name: 'Dosimetry', open: 7, late: 0, soon: 2, moved: 1, next: 27, last: -2, flagged: 2, issues: 0 },
    { key: 'RP', name: 'Radiological Protection', open: 21, late: 2, soon: 3, moved: 2, next: 4, last: -10, flagged: 1, issues: 1 },
    { key: 'DSL', name: 'DSL', open: 5, late: 0, soon: 0, moved: 0, next: 28, last: -7, flagged: 0, issues: 0 },
    { key: 'ALS', name: 'Active Lab & Sampling', open: 9, late: 0, soon: 1, moved: 1, next: 32, last: -1, flagged: 0, issues: 1 },
    { key: 'RW', name: 'Radwaste', open: 6, late: 3, soon: 1, moved: 1, next: 20, last: -15, flagged: 3, issues: 0 }
  ];
  var BY = {};
  AREAS.forEach(function (a) { BY[a.key] = a; });

  var PEOPLE = {
    tech: { first: 'Rachel', full: 'Rachel Boulden', initials: 'RB', role: 'Technician', areas: ['FLK', 'INS', 'GRS', 'DOS', 'RP', 'ALS'] },
    eng: { first: 'Kelly', full: 'Kelly Bates', initials: 'KB', role: 'Engineer', areas: ['FLK', 'GRS', 'RP', 'DSL', 'RW'] },
    mgmt: { first: 'Joseph', full: 'Joseph Pepper', initials: 'JP', role: 'Team Leader', areas: AREAS.map(function (a) { return a.key; }) }
  };

  // [reference, title, area, due offset in days, extra]
  var MINE = {
    tech: [
      ['ACT-00042', 'Replace FH40 probe', 'FLK', -2, { moved: 1 }],
      ['ACT-00057', 'Update dosimetry issue log', 'DOS', 0, {}],
      ['ACT-00061', 'Review RP survey frequencies', 'RP', 2, {}],
      ['ACT-00064', 'Calibrate sampling line flow meter', 'ALS', 5, { waiting: 'Spare parts on order' }],
      ['ACT-00070', 'Green Stream handover notes', 'GRS', 17, {}],
      ['ACT-00071', 'Instrument loan register tidy-up', 'INS', 28, {}]
    ],
    eng: [
      ['ACT-00038', 'Approve revised drum store labels', 'RW', -4, { moved: 2 }],
      ['ACT-00055', 'Review Green Stream sample results', 'GRS', 1, {}],
      ['ACT-00066', 'Update DSL operating instruction', 'DSL', 6, {}],
      ['ACT-00073', 'Flask procedure FLK-03 rewrite', 'FLK', 24, {}]
    ],
    mgmt: [
      ['ACT-00049', 'Agree Q4 training priorities', 'RP', 3, {}],
      ['ACT-00068', 'Sign off Radwaste audit response', 'RW', 35, {}]
    ]
  };

  var MANAGE = {
    eng: [
      { kind: 'Close-out check', text: 'Leak-test kit replacement is done – check and close it', area: 'FLK', ref: 'ACT-00031' },
      { kind: 'Late', text: 'Green Stream sampling backlog is 9 days late (Luke Cain)', area: 'GRS', ref: 'ACT-00022' },
      { kind: 'Late', text: 'Drum inventory reconciliation is 2 days late (Adam Washford)', area: 'RW', ref: 'ACT-00040' },
      { kind: 'For the meeting', text: '3 items flagged for the Radwaste meeting', area: 'RW' },
      { kind: 'Meeting', text: 'No Green Stream meeting since 2 September', area: 'GRS' }
    ],
    mgmt: [
      { kind: 'Late', text: '9 actions are late across 4 areas', area: null },
      { kind: 'Meeting', text: 'Green Stream has not met since 2 September', area: 'GRS' },
      { kind: 'Deadlines', text: '6 actions have had their deadline moved twice or more', area: null },
      { kind: 'Issue', text: '2 degradations are unresolved in Green Stream', area: 'GRS' },
      { kind: 'Late', text: 'Radwaste has 3 late actions out of 6 open', area: 'RW' }
    ]
  };

  var NOTICES = [
    { area: 'RP', title: 'New contamination survey forms from Monday', by: 'Andrea Medlicott', age: 0, important: true },
    { area: 'FLK', title: 'FH40 spares now in the stores cage', by: 'Nick Pearce', age: 1, important: false },
    { area: 'GRS', title: 'Sampling point SP-4 out of use until further notice', by: 'Kai Todd', age: 2, important: true },
    { area: 'DOS', title: 'Dosimeter issue times change in November', by: 'Doti Cange-Ainsworth', age: 3, important: false },
    { area: 'ALS', title: 'Fume cupboard 2 back in service', by: 'Trevor Baldwin', age: 4, important: false }
  ];

  var DATES = [
    { area: 'RP', title: 'Instrument calibration day', day: 6 },
    { area: 'GRS', title: 'Station outage planning review', day: 11 },
    { area: 'FLK', title: 'External audit visit', day: 14 }
  ];

  function dueText(off) {
    if (off < -1) return (-off) + ' days late';
    if (off === -1) return '1 day late';
    if (off === 0) return 'Due today';
    if (off === 1) return 'Due tomorrow';
    if (off < 7) return 'Due ' + WD[d(off).getUTCDay()];
    return 'Due ' + short(d(off));
  }
  function band(off) { return off < 0 ? 'late' : off < 7 ? 'soon' : 'later'; }


  // Area detail for the area panel: actions generated from each area's counts, notices and register entries.
  var TITLES = ['Monthly equipment checks', 'Update local instruction', 'Training records review', 'Calibration certificates filed', 'Survey meter source check',
    'Review of work instructions', 'Spares stock count', 'Housekeeping inspection', 'Procedure walk-down', 'Lessons learned write-up', 'Check alarm set points',
    'Replace worn labels', 'Data sheet sign-off', 'Contractor briefing pack', 'Waste route review', 'Sample bottle reorder', 'Log book audit',
    'Equipment loan returns', 'Risk assessment refresh', 'Shift handover checklist', 'Fault report follow-up', 'Quality check of records'];
  var OWNERS = ['Andrea Medlicott', 'Kelly Bates', 'Ben Beak', 'Dave Beeching', 'Aiden Gorham', 'Jake Stafford', 'Chloe Tilly', 'Trevor Baldwin',
    'Rachel Boulden', 'Mark Buckley', 'Luke Cain', 'Adrian Cooke', 'Charlie Everitt', 'Matt Henley', 'Kevin Hewitt', 'Richard Howe', 'Nick Pearce', 'Steve Punnett'];
  var ISSUES = {
    GRS: [['Degradation', 'Sampling pump flow drifting low', 'Open'], ['Degradation', 'SP-4 sample point blocked', 'Under review'], ['Improvement', 'Move logbook to tablet', 'Open']],
    FLK: [['Degradation', 'FH40 probe cable worn', 'Under review'], ['Improvement', 'Shadow board for flask tools', 'Open']],
    RP: [['Degradation', 'Survey meter battery life short', 'Open'], ['Improvement', 'Pre-filled survey forms', 'Resolved']],
    ALS: [['Degradation', 'Fume cupboard 2 low face velocity', 'Resolved']],
    RW: [['Improvement', 'Colour-coded drum labels', 'Open']]
  };
  function areaDetail(key) {
    var a = BY[key], i = AREAS.indexOf(a), list = [], n = 0;
    function add(off) { list.push({ title: TITLES[(i * 5 + n) % TITLES.length], owner: OWNERS[(i * 7 + n * 3) % OWNERS.length], off: off, due: dueText(off), band: band(off) }); n++; }
    for (var k = 0; k < a.late; k++) add(-(2 + k * 3));
    for (k = 0; k < a.soon; k++) add(1 + k * 2 > 6 ? 6 : 1 + k * 2);
    for (k = 0; k < a.open - a.late - a.soon; k++) add(9 + k * 4);
    return {
      area: a, actions: list,
      notices: NOTICES.filter(function (x) { return x.area === key; }).map(function (x) { return { title: x.title, by: x.by, when: x.age === 0 ? 'Today' : x.age === 1 ? 'Yesterday' : x.age + ' days ago', important: x.important, kind: 'Notice' }; })
        .concat([{ title: 'Reminder: keep the area log up to date', by: OWNERS[(i * 3) % OWNERS.length], when: '6 days ago', important: false, kind: 'Notice' }]),
      issues: (ISSUES[key] || []).map(function (x) { return { kind: x[0], title: x[1], status: x[2] }; }),
      next: a.next === null ? null : { when: wdShort(d(a.next)), time: '10:00', place: 'Admin building, room 2', items: a.flagged + a.late + 4, flagged: a.flagged },
      last: { when: wdShort(d(a.last)), stale: a.last < -35 },
      dates: DATES.filter(function (x) { return x.area === key; }).map(function (x) { return { title: x.title, when: wdShort(d(x.day)) }; })
    };
  }

  window.CHDATA = function (role) {
    var p = PEOPLE[role];
    var mine = MINE[role].map(function (r) {
      return { ref: r[0], title: r[1], area: BY[r[2]], off: r[3], due: dueText(r[3]), band: band(r[3]), date: d(r[3]), moved: r[4].moved || 0, waiting: r[4].waiting || '' };
    });
    var areas = p.areas.map(function (k) {
      var a = BY[k];
      return {
        key: a.key, name: a.name, open: a.open, late: a.late, soon: a.soon, moved: a.moved, flagged: a.flagged, issues: a.issues,
        next: a.next === null ? null : d(a.next), nextText: a.next === null ? 'No meeting booked' : 'Meeting ' + wdShort(d(a.next)),
        lastText: 'Last met ' + short(d(a.last)), stale: a.last < -35, nextIn: a.next
      };
    });
    var meetings = areas.filter(function (a) { return a.next; }).sort(function (x, y) { return x.next - y.next; }).slice(0, 4)
      .map(function (a) { return { area: a, date: a.next, when: wdShort(a.next), time: '10:00', place: 'Admin building, room 2', items: a.flagged + a.late + 4 }; });
    var group = AREAS.reduce(function (t, a) { t.open += a.open; t.late += a.late; t.soon += a.soon; t.moved += a.moved; t.issues += a.issues; return t; }, { open: 0, late: 0, soon: 0, moved: 0, issues: 0, done30: 23 });
    var hour = 9;
    return {
      role: role, isMgmt: role === 'mgmt', canManage: role !== 'tech', person: p,
      greeting: (hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening') + ', ' + p.first,
      todayLong: 'Friday 23 October 2026',
      mine: mine,
      late: mine.filter(function (a) { return a.band === 'late'; }),
      soon: mine.filter(function (a) { return a.band === 'soon'; }),
      later: mine.filter(function (a) { return a.band === 'later'; }),
      areas: areas, allAreas: AREAS,
      manage: MANAGE[role] || [],
      meetings: meetings,
      notices: NOTICES.filter(function (n) { return p.areas.indexOf(n.area) >= 0; }).map(function (n) {
        return { area: BY[n.area], title: n.title, by: n.by, when: n.age === 0 ? 'Today' : n.age === 1 ? 'Yesterday' : n.age + ' days ago', important: n.important };
      }),
      dates: DATES.filter(function (x) { return p.areas.indexOf(x.area) >= 0; }).map(function (x) { return { area: BY[x.area], title: x.title, when: wdShort(d(x.day)), date: d(x.day) }; }),
      group: group,
      week: [0, 1, 2, 3, 4, 5, 6].map(function (i) {
        var dt = d(i);
        return {
          date: dt, label: WD[dt.getUTCDay()].slice(0, 3), num: dt.getUTCDate(), today: i === 0, weekend: dt.getUTCDay() === 0 || dt.getUTCDay() === 6,
          actions: mine.filter(function (a) { return a.off === i || (i === 0 && a.off < 0); }),
          meetings: meetings.filter(function (m) { return Math.round((m.date - TODAY) / DAY) === i; })
        };
      }),
      tiles: AREAS.map(function (a) { return { key: a.key, name: a.name, open: a.open, late: a.late, member: p.areas.indexOf(a.key) >= 0, stale: a.last < -35,
        nextText: a.last < -35 ? 'No meeting since ' + short(d(a.last)) : a.next === null ? 'No meeting booked' : 'Meets ' + wdShort(d(a.next)) }; }),
      areaDetail: areaDetail,
      helpers: { short: short, wdShort: wdShort }
    };
  };

  // Tiny element helper: h('div', {class: 'x', text: 'y'}, child, ...)
  window.h = function (tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'text') el.textContent = v;
      else if (k === 'class') el.className = v;
      else if (k === 'style') el.setAttribute('style', v);
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined || c === false) continue;
      if (Array.isArray(c)) c.forEach(function (x) { if (x) el.appendChild(typeof x === 'string' ? document.createTextNode(x) : x); });
      else el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return el;
  };
})();
</script>
<script>window.DESIGN = {n: 5, name: document.title.split(" – ").pop(), files: ["design-1-control.html", "design-2-editorial.html", "design-3-operations.html", "design-4-week.html", "design-5-bento.html"]};</script>

<style>
  :root {
    --bg: #eceef1; --tile: #fff; --ink: #14171c; --muted: #5f6673; --line: #e3e6ea; --dark: #15191f; --dark-2: #222831;
    --coral: #e8553b; --coral-soft: #fde9e4; --mint: #13996f; --mint-soft: #e2f5ee; --amber: #b7791f; --amber-soft: #fdf1dc; --sky: #2563c9; --sky-soft: #e5eefc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Segoe UI", system-ui, Arial, sans-serif; }
  button { font: inherit; cursor: pointer; }
  .shell { padding: 20px 28px 36px; display: flex; flex-direction: column; gap: 18px; }
  .top { display: flex; align-items: center; gap: 16px; }
  .wordmark { font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
  .wordmark span { color: var(--coral); }
  .seg { display: flex; gap: 2px; background: #dfe2e7; border-radius: 10px; padding: 3px; margin-left: 18px; }
  .seg a { text-decoration: none; color: #3d4450; padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; }
  .seg a[aria-current] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .user { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .user b { color: var(--ink); }
  .av { width: 34px; height: 34px; border-radius: 10px; background: var(--dark); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .env { font-size: 11px; font-weight: 700; background: var(--amber-soft); color: var(--amber); border-radius: 6px; padding: 2px 8px; }

  .bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px;
    grid-template-areas: "hero hero hero hero hero hero s1 s1 s2 s2 s3 s3" "hero hero hero hero hero hero at at at at at at" "do do do li li li li li mt mt mt mt" "do do do li li li li li no no no no" "ar ar ar ar ar ar ar ar ar ar ar ar"; }
  .t { background: var(--tile); border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .t h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }
  .t h2 a { margin-left: auto; color: var(--sky); text-transform: none; letter-spacing: 0; text-decoration: none; font-size: 13px; }

  .hero { grid-area: hero; background: var(--dark); color: #fff; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; right: -80px; top: -80px; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, rgba(232,85,59,.55), rgba(232,85,59,0) 70%); }
  .hero .hi { font-size: 15px; color: #b8c0cc; }
  .hero h1 { margin: 0; font-size: 34px; line-height: 1.1; letter-spacing: -.6px; font-weight: 700; max-width: 16ch; position: relative; z-index: 1; }
  .hero .up { margin-top: auto; background: var(--dark-2); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; position: relative; z-index: 1; }
  .hero .up small { color: #ff9b86; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .hero .up b { font-size: 17px; } .hero .up span { color: #b8c0cc; font-size: 13px; }
  .hero .row { display: flex; gap: 10px; position: relative; z-index: 1; }
  .btn { border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 700; }
  .btn.coral { background: var(--coral); color: #fff; } .btn.ghost { background: rgba(255,255,255,.1); color: #fff; }
  .btn:focus-visible, a:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  .stat { justify-content: space-between; min-height: 150px; } .stat.late { grid-area: s1; } .stat.soon { grid-area: s2; } .stat.ok { grid-area: s3; }
  .stat .big { font-size: 48px; font-weight: 800; line-height: 1; letter-spacing: -1.5px; }
  .stat .cap { color: var(--muted); font-size: 13px; }
  .stat.late { background: var(--coral-soft); } .stat.late .big { color: var(--coral); }
  .stat.soon { background: var(--amber-soft); } .stat.soon .big { color: var(--amber); }
  .stat.ok { background: var(--mint-soft); } .stat.ok .big { color: var(--mint); }

  .donut { grid-area: do; align-items: center; }
  .ring { width: 170px; height: 170px; border-radius: 50%; display: grid; place-items: center; margin: 6px auto 4px; }
  .ring div { width: 118px; height: 118px; background: #fff; border-radius: 50%; display: grid; place-items: center; text-align: center; }
  .ring b { font-size: 36px; font-weight: 800; display: block; line-height: 1; } .ring small { color: var(--muted); font-size: 12px; }
  .legend { display: flex; flex-direction: column; gap: 6px; width: 100%; font-size: 13px; }
  .legend span { display: flex; align-items: center; gap: 8px; } .legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); } .legend em { margin-left: auto; font-style: normal; font-weight: 700; }

  .list { grid-area: li; }
  .items { display: flex; flex-direction: column; gap: 8px; }
  .it { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .it:last-child { border-bottom: 0; }
  .it i { align-self: stretch; border-radius: 2px; background: var(--c); }
  .it b { display: block; font-weight: 600; } .it small { color: var(--muted); font-size: 12.5px; }
  .it em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--c); white-space: nowrap; }

  .areas { grid-area: ar; }
  .agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
  .ac { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; }
  .ac:hover { border-color: #c4cad3; background: #fafbfc; }
  .ac b { font-size: 14.5px; } .ac small { color: var(--muted); font-size: 12.5px; }
  .meter { height: 6px; background: #edf0f3; border-radius: 3px; overflow: hidden; display: flex; }
  .meter span { height: 100%; }
  .badge { align-self: flex-start; font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 1px 8px; }
  .badge.late { background: var(--coral-soft); color: var(--coral); } .badge.ok { background: var(--mint-soft); color: var(--mint); }

  .mtg { grid-area: mt; }
  .mrow { display: flex; gap: 12px; align-items: center; padding: 6px 0; }
  .cal { width: 46px; flex: none; border-radius: 10px; overflow: hidden; text-align: center; border: 1px solid var(--line); }
  .cal small { display: block; background: var(--sky); color: #fff; font-size: 10.5px; font-weight: 700; text-transform: uppercase; padding: 1px 0; }
  .cal b { display: block; font-size: 18px; padding: 2px 0 3px; }
  .mrow span b { display: block; font-weight: 600; } .mrow span small { color: var(--muted); font-size: 12.5px; }
  .notes { grid-area: no; }
  .note { padding: 7px 0; border-bottom: 1px solid var(--line); } .note:last-child { border-bottom: 0; }
  .note b { display: block; font-weight: 600; } .note small { color: var(--muted); font-size: 12.5px; }
  .pin { color: var(--coral); font-weight: 700; }
  .attn { grid-area: at; background: var(--sky-soft); }
  .attn ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .attn li { background: #fff; border-radius: 12px; padding: 9px 12px; } .attn li small { display: block; color: var(--sky); font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
  @media (max-width: 1400px) { .bento { grid-template-areas: "hero hero hero hero hero hero hero hero hero hero hero hero" "s1 s1 s1 s1 s2 s2 s2 s2 s3 s3 s3 s3" "at at at at at at at at at at at at" "do do do do li li li li li li li li" "mt mt mt mt mt mt no no no no no no" "ar ar ar ar ar ar ar ar ar ar ar ar"; } }

<div id="pv"></div>
<script>
window.renderDesign = function (root, D) {
  var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var top = h('header', { class: 'top' },
    h('div', { class: 'wordmark' }, 'Competency', h('span', { text: 'Hub' })),
    h('span', { class: 'env', text: 'TEST DATA' }),
    h('nav', { class: 'seg', 'aria-label': 'Main' }, ['Home', 'My actions', 'Areas', 'Notices', 'Meetings'].concat(D.isMgmt ? ['Management'] : []).map(function (x, i) { return h('a', { href: '#', 'aria-current': i === 0 ? 'page' : null, text: x }); })),
    h('div', { class: 'user' }, h('span', null, h('b', { text: D.person.full }), ' · ' + D.person.role), h('div', { class: 'av', text: D.person.initials })));

  var first = D.late[0] || D.soon[0] || D.later[0];
  var hero = h('section', { class: 't hero' },
    h('div', { class: 'hi', text: D.todayLong }),
    h('h1', { text: D.greeting + '.' }),
    first ? h('div', { class: 'up' }, h('small', { text: first.band === 'late' ? 'Do this first' : 'Next up' }), h('b', { text: first.title }), h('span', { text: first.area.name + ' · ' + first.due })) : null,
    h('div', { class: 'row' }, h('button', { class: 'btn coral', type: 'button', text: 'Raise an action' }), h('button', { class: 'btn ghost', type: 'button', text: 'Post a notice' })));

  var src = D.isMgmt ? { late: D.group.late, soon: D.group.soon, open: D.group.open } : { late: D.late.length, soon: D.soon.length, open: D.mine.length };
  var stats = [
    h('section', { class: 't stat late' }, h('h2', { text: 'Late' }), h('div', null, h('div', { class: 'big', text: String(src.late) }), h('div', { class: 'cap', text: D.isMgmt ? 'across the group' : src.late ? 'start with these' : 'nothing late' }))),
    h('section', { class: 't stat soon' }, h('h2', { text: 'Next 7 days' }), h('div', null, h('div', { class: 'big', text: String(src.soon) }), h('div', { class: 'cap', text: 'due soon' }))),
    h('section', { class: 't stat ok' }, h('h2', { text: D.isMgmt ? 'Done in 30 days' : 'Areas' }), h('div', null, h('div', { class: 'big', text: String(D.isMgmt ? D.group.done30 : D.areas.length) }), h('div', { class: 'cap', text: D.isMgmt ? 'actions completed' : 'you belong to' })))
  ];

  var other = Math.max(src.open - src.late - src.soon, 0);
  var pl = src.open ? src.late / src.open * 100 : 0, ps = src.open ? src.soon / src.open * 100 : 0;
  var donut = h('section', { class: 't donut' }, h('h2', { style: 'align-self:stretch', text: D.isMgmt ? 'Group actions' : 'Your actions' }),
    h('div', { class: 'ring', style: 'background:conic-gradient(var(--coral) 0 ' + pl + '%, #e8a73c ' + pl + '% ' + (pl + ps) + '%, #9fb4cc ' + (pl + ps) + '% 100%)' },
      h('div', null, h('span', null, h('b', { text: String(src.open) }), h('small', { text: 'open' })))),
    h('div', { class: 'legend' },
      h('span', { style: '--c:var(--coral)' }, h('i'), 'Late', h('em', { text: String(src.late) })),
      h('span', { style: '--c:#e8a73c' }, h('i'), 'Due in 7 days', h('em', { text: String(src.soon) })),
      h('span', { style: '--c:#9fb4cc' }, h('i'), 'Later', h('em', { text: String(other) }))));

  var colour = { late: 'var(--coral)', soon: 'var(--amber)', later: '#8b95a3' };
  var list = h('section', { class: 't list' }, h('h2', null, D.isMgmt ? 'Your own actions' : 'Your actions', h('a', { href: '#', text: 'See all' })),
    h('div', { class: 'items' }, D.mine.slice(0, 6).map(function (a) {
      return h('div', { class: 'it', style: '--c:' + colour[a.band] }, h('i'), h('span', null, h('b', { text: a.title }), h('small', { text: a.area.name + (a.waiting ? ' · Waiting on: ' + a.waiting : '') })), h('em', { text: a.due }));
    })));

  var areas = h('section', { class: 't areas' }, h('h2', null, D.isMgmt ? 'All ten areas' : 'Your areas', h('a', { href: '#', text: 'Browse areas' })),
    h('div', { class: 'agrid' }, D.areas.map(function (a) {
      var max = 22;
      return h('a', { href: '#', class: 'ac' }, h('b', { text: a.name }),
        h('span', { class: 'badge ' + (a.late ? 'late' : 'ok'), text: a.late ? a.late + ' late' : 'On track' }),
        h('div', { class: 'meter', 'aria-hidden': 'true' }, h('span', { style: 'width:' + a.late / max * 100 + '%;background:var(--coral)' }), h('span', { style: 'width:' + a.soon / max * 100 + '%;background:#e8a73c' }), h('span', { style: 'width:' + (a.open - a.late - a.soon) / max * 100 + '%;background:#9fb4cc' })),
        h('small', { text: a.open + ' open · ' + (a.stale ? 'no meeting since 2 Sep' : a.next ? 'meets ' + D.helpers.short(a.next) : 'no meeting booked') }));
    })));

  var mtg = h('section', { class: 't mtg' }, h('h2', null, 'Meetings', h('a', { href: '#', text: 'All' })),
    D.meetings.slice(0, 3).map(function (m) { return h('div', { class: 'mrow' }, h('div', { class: 'cal' }, h('small', { text: M[m.date.getUTCMonth()] }), h('b', { text: String(m.date.getUTCDate()) })), h('span', null, h('b', { text: m.area.name }), h('small', { text: m.time + ' · ' + m.items + ' agenda items' }))); }));

  var notes = h('section', { class: 't notes' }, h('h2', null, 'Notices', h('a', { href: '#', text: 'All' })),
    D.notices.slice(0, 3).map(function (n) { return h('div', { class: 'note' }, h('b', null, n.important ? h('span', { class: 'pin', text: '● ' }) : null, n.title), h('small', { text: n.area.name + ' · ' + n.when })); }));

  var attn = D.manage.length ? h('section', { class: 't attn' }, h('h2', { text: D.isMgmt ? 'Needs your attention' : 'For you to manage' }),
    h('ul', null, D.manage.slice(0, 4).map(function (m) { return h('li', null, h('small', { text: m.kind }), m.text); }))) : null;

  var grid = h('div', { class: 'bento' }, hero, stats, donut, list, areas, attn || h('section', { class: 't attn' }, h('h2', { text: 'Coming up' }), h('ul', null, D.dates.map(function (x) { return h('li', null, h('small', { text: x.when }), x.title + ' · ' + x.area.name); }))), mtg, notes);
  root.appendChild(h('div', { class: 'shell' }, top, grid));
};
</script>
<script>
// Preview controls: design name, previous/next design and "Preview as". Stands in for SharePoint's own bar.
(function () {
  'use strict';
  var D = window.DESIGN;
  var ROLES = [['tech', 'Technician'], ['eng', 'Engineer'], ['mgmt', 'Team Leader']];
  var params = new URLSearchParams(location.search);
  var role = params.get('role') || 'tech';
  if (!ROLES.some(function (r) { return r[0] === role; })) role = 'tech';

  function bar() {
    var b = h('div', { class: 'pv-switch', role: 'navigation', 'aria-label': 'Preview controls' },
      h('span', { class: 'pv-name' }, h('b', { text: 'Design ' + D.n + ' of 5' }), ' · ' + D.name),
      D.n > 1 ? h('a', { href: D.files[D.n - 2] + '?role=' + role, text: '‹ Previous' }) : null,
      D.n < 5 ? h('a', { href: D.files[D.n] + '?role=' + role, text: 'Next ›' }) : null,
      h('span', { class: 'pv-sep', text: 'Preview as' }),
      ROLES.map(function (r) {
        return h('button', { type: 'button', 'aria-pressed': String(r[0] === role), text: r[1], onclick: function () { role = r[0]; history.replaceState(null, '', '?role=' + role); draw(); } });
      }));
    return b;
  }
  function draw() {
    var root = document.getElementById('pv');
    root.textContent = '';
    root.appendChild(bar());
    var app = h('div', { class: 'pv-app' });
    root.appendChild(app);
    window.renderDesign(app, window.CHDATA(role));
  }
  document.addEventListener('DOMContentLoaded', draw);
})();
</script>
